  }else{
    const box = el("div","scroll-box");
    playerData.inventory.forEach(it=>{
      const r = el("div","row");
      const info = el("div","info");
      const n = el("div","name");
      n.innerHTML = `${it.name} <span class="tag" style="color:${qualityConfig[it.quality].color}">${qualityConfig[it.quality].name}</span>`;
      const d = el("div","desc");
      d.innerHTML = `${equipStatText(it)}　五行 ${elementOf(it.element).name}`;
      info.appendChild(n); info.appendChild(d);
      r.appendChild(info);
      const wrap = el("div");
      wrap.style.cssText = "display:flex;gap:6px;flex:0 0 auto";
      const b1 = el("button","btn gold"); b1.textContent = "穿戴";
      b1.onclick = ()=>equipItem(it.uid);
      const b2 = el("button","btn"); b2.textContent = "出售";
      b2.onclick = ()=>sellItem(it.uid);
      wrap.appendChild(b1); wrap.appendChild(b2);
      r.appendChild(wrap);
      box.appendChild(r);
    });
    cb.appendChild(box);
  }
  root.appendChild(cb);

  /* 战斗功法 */
  const cs = mkCard("战斗功法", `感悟 ${playerData.insight}`);
  battleSkillConfig.forEach((c,i)=>{
    const owned = playerData.battleSkillUnlocked.includes(i);
    const lv = owned ? skillLevel(i) : 0;
    const active = playerData.battleSkill === i;
    const r = el("div","row");
    const info = el("div","info");
    const n = el("div","name");
    n.innerHTML = `${c.name} <span class="tag" style="color:${elementOf(c.element).color}">${elementOf(c.element).name}</span>` +
      (owned ? `<span class="tag" style="color:var(--gold)">${lv} 重</span>` : "") +
      (active ? `<span class="tag" style="color:var(--green)">已装备</span>` : "");
    const d = el("div","desc");
    d.innerHTML = `${c.desc}　攻+${c.atk} 防+${c.def} 血+${c.hp}　胜率 ×${c.rate}`;
    info.appendChild(n); info.appendChild(d);
    r.appendChild(info);
    const wrap = el("div");
    wrap.style.cssText = "display:flex;gap:6px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end";
    if(!owned){
      const b = el("button","btn gold");
      b.textContent = `习得(${fmt(c.cost)})`;
      b.disabled = playerData.spirit < c.cost;
      b.onclick = ()=>unlockBattleSkill(i);
      const b2 = el("button","btn");
      b2.textContent = `撰写(${c.insightCost}感悟)`;
      b2.disabled = playerData.insight < c.insightCost;
      b2.onclick = ()=>writeBattleSkill(i);
      wrap.appendChild(b2); wrap.appendChild(b);
    }else{
      if(!active){
        const b = el("button","btn"); b.textContent = "装备";
        b.onclick = ()=>equipBattleSkill(i);
        wrap.appendChild(b);
      }
      const up = el("button","btn gold");
      up.textContent = lv>=BATTLE_SKILL_MAX_LV ? "圆满" : `参悟(${skillUpgradeCost(lv)})`;
      up.disabled = lv>=BATTLE_SKILL_MAX_LV || playerData.insight < skillUpgradeCost(lv);
      up.onclick = ()=>upgradeBattleSkill(i);
      wrap.appendChild(up);
    }
    r.appendChild(wrap);
    cs.appendChild(r);
  });
  root.appendChild(cs);

  /* 灵宠 */
  const cp = mkCard("灵宠");
  petConfig.forEach((p,i)=>{
    const owned = playerData.pets.includes(i);
    const active = playerData.activePet === i;
    cp.appendChild(mkRow(
      `${p.icon} ${p.name} <span class="tag" style="color:${elementOf(p.element).color}">${elementOf(p.element).name}</span>` +
        (active ? '<span class="tag" style="color:var(--green)">出战</span>' : ""),
      `${p.desc}　攻+${p.atk} 防+${p.def} 血+${p.hp}`,
      owned ? (active?"收回":"出战") : `结缘(${fmt(p.cost)})`,
      owned ? "" : "gold",
      ()=> owned ? setActivePet(i) : recruitPet(i),
      !owned && playerData.spirit < p.cost
    ));
  });
  root.appendChild(cp);

  /* 本命法宝 */
  const ca = mkCard("本命法宝", playerData.artifactId
    ? `${artifactConfig.find(a=>a.id===playerData.artifactId).name} ${playerData.artifactLv} 阶` : "未铸就");
  if(!playerData.artifactId){
    if(playerData.level < 5){
      ca.appendChild(mkHint("筑基期（炼气圆满突破后）方可铸就本命法宝。"));
    }else{
      artifactConfig.forEach(a=>{
        ca.appendChild(mkRow(
          `${a.icon} ${a.name} <span class="tag" style="color:${a.color}">${elementOf(a.element).name}</span>`,
          `${a.desc}　铸就需仙材 2000 · 丹渣 50`,
          "铸就", "gold", ()=>forgeArtifact(a.id)
        ));
      });
    }
  }else{
    const cfg = artifactConfig.find(a=>a.id===playerData.artifactId);
    const lv = playerData.artifactLv;
    const elx = playerData.artifactElement || cfg.element;
    ca.appendChild(mkHint(
      `当前倍率 <b style="color:var(--gold)">×${(cfg.base+cfg.step*(lv-1)).toFixed(3)}</b>　` +
      `升至 ${lv+1} 阶需：仙材 ${fmt(artifactMatCost(lv))} · 丹渣 ${artifactDregCost(lv)}` +
      (artifactLuckCost(lv) ? ` · 气运 ${artifactLuckCost(lv)}` : "") +
      (artifactOreCost(lv) ? ` · ${oreConfig[elx].icon}${oreConfig[elx].name} ${artifactOreCost(lv)}` : "") +
      `<br>温养至 ${ARTIFACT_YUANYING_LV} 阶后，转生时法宝将脱落留于地图，待后世回收。`
    ));
    const b = el("button","btn gold");
    b.style.cssText = "width:100%;margin-top:8px";
    b.textContent = lv >= cfg.maxLv ? "已至最高阶" : "温养提升";
    b.disabled = lv >= cfg.maxLv;
    b.onclick = upgradeArtifact;
    ca.appendChild(b);
  }
  root.appendChild(ca);

  /* 五行矿石 */
  const co = mkCard("五行矿石");
  elementConfig.forEach(e=>{
    co.appendChild(mkRow(
      `${oreConfig[e.id].icon} ${oreConfig[e.id].name}`,
      `拥有 ${playerData.ore[e.id]||0}　用于高阶本命法宝温养`,
      "", null, null, true
    ));
  });
  root.appendChild(co);

  /* 前世兵器 */
  if(playerData.weapons.length){
    const cw = mkCard("遗落神兵", `${playerData.weapons.length} 件`);
    playerData.weapons.forEach(w=>{
      cw.appendChild(mkRow(
        `<span style="color:${w.color}">${w.icon} ${w.name}</span>`,
        `产出倍率 ×${w.rate.toFixed(3)}（本轮有效，转生清空）`,
        "", null, null, true
      ));
    });
    root.appendChild(cw);
  }
}

/* ============================================================
 *  十六-F：宗门
 * ============================================================ */
function viewSect(root){
  /* 宗门 */
  const cg = mkCard("宗门", playerData.guild ? guildCfg().name : "未入宗门");
  if(!playerData.guild){
    cg.appendChild(mkHint("抵达炼气一层后可加入宗门。宗门身份永久保留，转生不清。"));
    guildConfig.forEach(g=>{
      const opt = el("div","sect-opt");
      opt.innerHTML = `<div class="sect-icon" style="color:${g.color}">${g.icon}</div>
        <div class="sect-info"><div class="sect-name">${g.name}</div>
        <div class="sect-desc">${g.desc}</div></div>`;
      const b = el("button","btn gold");
      b.textContent = "加入";
      b.disabled = playerData.level < 1;
      b.onclick = ()=>joinGuild(g.id);
      opt.appendChild(b);
      cg.appendChild(opt);
    });
  }else{
    const g = guildCfg();
    const rank = guildRankConfig[guildRankIndex()];
    cg.appendChild(mkHint(
      `${g.icon} ${g.name}　职位：<b style="color:var(--gold)">${rank.name}</b>（全产出 ×${rank.rate.toFixed(2)}）<br>` +
      `贡献 ${playerData.guildContrib}　累计 ${playerData.guildContribEarned}<br>` +
      `今日委托：${playerData.guildQuestDone ? '<span style="color:var(--green)">已完成</span>' : '<span style="color:var(--orange)">未完成</span>'}（委托类型：${g.quest}）`
    ));
    const shop = el("div");
    guildShopConfig.forEach(s=>{
      shop.appendChild(mkRow(
        s.name, `${s.desc}　消耗贡献 ${s.cost}`,
        "兑换", "gold", ()=>buyGuildShop(s.id),
        playerData.guildContrib < s.cost
      ));
    });
    cg.appendChild(shop);
  }
  root.appendChild(cg);

  /* 体质 */
  const cc = mkCard("特殊体质", `${playerData.constitution.length}/${constitutionConfig.length}`);
  constitutionConfig.forEach(c=>{
    const got = constitutionUnlocked(c);
    const cur = constitutionProgress(c);
    cc.appendChild(mkRow(
      `${c.icon} ${got ? c.name : "???"} ${got ? `<span class="tag" style="color:${c.color}">已解锁</span>` : ""}`,
      got ? c.desc : `${c.hint}（${cur}/${c.cond.target}）`,
      "", null, null, true
    ));
  });
  root.appendChild(cc);

  /* 成就 */
  const ca = mkCard("成就", `${playerData.achClaimed.length}/${achievementConfig.length}`);
  const abox = el("div","scroll-box");
  achievementConfig.forEach(cfg=>{
    const done = playerData.achCompleted.includes(cfg.id);
    const claimed = playerData.achClaimed.includes(cfg.id);
    abox.appendChild(mkRow(
      `${done?"🏅":"🔒"} ${cfg.name}`,
      `${cfg.desc}　奖励：灵力 ${fmt(cfg.rewardSpirit)} · 仙材 ${cfg.rewardMat}`,
      claimed ? "已领取" : (done ? "领取" : "未达成"),
      done && !claimed ? "gold" : "",
      ()=>{
        if(!done || claimed) return;
        playerData.achClaimed.push(cfg.id);
        playerData.spirit += cfg.rewardSpirit;
        playerData.material += cfg.rewardMat;
        saveSave(); renderUI();
        toast(`领取成就【${cfg.name}】奖励`);
      },
      !done || claimed
    ));
  });
  ca.appendChild(abox);
  root.appendChild(ca);

  /* 日常 */
  const cd = mkCard("每日任务");
  dailyTaskConfig.forEach((t,i)=>{
    const done = playerData.dailyProgress[i] >= t.target;
    const claimed = playerData.dailyClaimed[i];
    const prog = Math.min(playerData.dailyProgress[i], t.target);
    cd.appendChild(mkRow(
      `${t.name} <span class="tag" style="color:var(--muted)">${prog}/${t.target}</span>`,
      `${t.desc}　奖励：灵力 ${fmt(t.rewardSpirit)} · 仙材 ${t.rewardMat}`,
      claimed ? "已领取" : (done ? "领取" : "进行中"),
      done && !claimed ? "gold" : "",
      ()=>{
        if(!done || claimed) return;
        playerData.dailyClaimed[i] = true;
        playerData.spirit += t.rewardSpirit;
        playerData.material += t.rewardMat;
        playerData.luckPoints += SETTING.luckPerDaily;
        saveSave(); renderUI();
        toast(`领取日常【${t.name}】`);
      },
      !done || claimed
    ));
  });
  root.appendChild(cd);
}

/* ============================================================
 *  十六-G：转生
 * ============================================================ */
function viewReinc(root){
  const c = mkCard("轮回转生", `${playerData.reincCount} 转`);
  c.appendChild(mkHint(
    `当前：<b style="color:var(--gold)">${reincConfig[playerData.reincCount].name}</b>　灵力总倍率 ×${getReincTotalRate().toFixed(2)}<br>` +
    `传承点 <b class="num">${playerData.reincPoints}</b>　历劫：成功 ${playerData.tribWin} · 失败 ${playerData.tribFail}<br>` +
    `转生条件：境界达 <b>${levelConfig[MAX_PLAYABLE_LEVEL].name}</b>（当前 ${levelConfig[playerData.level].name}）`
  ));
  const b = el("button","btn gold");
  b.style.cssText = "width:100%;margin-top:10px;padding:11px";
  b.textContent = "踏入轮回";
  b.disabled = playerData.level < MAX_PLAYABLE_LEVEL;
  b.onclick = doReincarnate;
  c.appendChild(b);
  root.appendChild(c);

  /* 出身 */
  if(playerData.origin){
    const co = mkCard("此世出身", playerData.origin.name);
    const o = playerData.origin;
    co.appendChild(mkHint(
      `<b style="color:${o.color}">${o.icon} ${o.name}</b><br>${o.desc}<br>` +
      `在线 ×${o.mods.online||1}　离线 ×${o.mods.offline||1}　攻 +${o.mods.atk||0}　防 +${o.mods.def||0}　血 +${o.mods.hp||0}`
    ));
    root.appendChild(co);
  }

  /* 传承线 */
  const ch = mkCard("传承线", `传承点 ${playerData.reincPoints}`);
  heritageConfig.forEach(h=>{
    const lv = playerData.heritage[h.id]||0;
    const cost = lv+1;
    ch.appendChild(mkRow(
      `${h.name} <span class="tag" style="color:var(--gold)">${lv}/${h.maxLv}</span>`,
      `${h.desc}${h.id==="luck" ? `（已减免 ${2*lv} 点）` : ""}${lv>=h.maxLv?"　已满级":""}`,
      lv>=h.maxLv ? "满级" : `升级(${cost}点)`,
      lv>=h.maxLv ? "" : "gold",
      ()=>buyHeritage(h.id),
      lv>=h.maxLv || playerData.reincPoints < cost
    ));
  });
  root.appendChild(ch);

  /* 修炼体系 */
  const cs = mkCard("修炼体系", playerData.sect ? sectConfig.find(s=>s.id===playerData.sect).name : "散修");
  cs.appendChild(mkHint(
    playerData.sect
      ? (()=>{
          const s = sectConfig.find(x=>x.id===playerData.sect);
          let extra = "";
          if(playerData.sect==="sword") extra = `　剑势 ${swordStack()}/${realmSwordCap()} 层`;
          if(playerData.sect==="body")  extra = `　淬体 ${bodyStack()}/${realmBodyCap()} 层`;
          return `${s.icon} ${s.name}：${s.desc}${extra}`;
        })()
      : "尚未拜入道途，突破筑基境时可凭信物选择。"
  ));
  if(!playerData.sect){
    const arr = sectConfig.map(s=>`${s.matName} ${sectMaterialCount(s.id)}/${SECT_MAT_NEED}`);
    cs.appendChild(mkHint("信物进度：" + arr.join("　")));
    if(playerData.level >= 5){
      const bb = el("button","btn gold");
      bb.style.cssText = "width:100%;margin-top:8px";
      bb.textContent = "选择修炼体系";
      bb.onclick = openSectSelect;
      cs.appendChild(bb);
    }
  }
  root.appendChild(cs);
}

/* ============================================================
 *  十六-H：视图注册
 * ============================================================ */
const VIEW_RENDERERS = {
  cultivate: viewCultivate,
  secret:    viewSecret,
  explore:   viewExplore,
  encounter: viewEncounter,
  grow:      viewGrow,
  sect:      viewSect,
  reinc:     viewReinc,
};

/* ============================================================
 *  十七、顶栏刷新
 * ============================================================ */
function updateHeader(){
  const sp = document.getElementById("spirit");
  if(sp) sp.textContent = fmt(playerData.spirit);
  const ps = document.getElementById("perSec");
  if(ps) ps.textContent = fmt(getSpiritPerSec()) + "/s";
  const ln = document.getElementById("levelName");
  if(ln) ln.textContent = levelConfig[playerData.level].name;
  const cp = document.getElementById("cp");
  if(cp) cp.textContent = fmt(getCombatPower());

  const b = document.getElementById("buffs");
  if(!b) return;
  b.innerHTML = "";
  const add = (txt, color)=>{
    const d = el("div","buff");
    if(color) d.style.color = color;
    d.textContent = txt;
    b.appendChild(d);
  };
  add(`气运·${luckConfig[playerData.luckIndex].name}`, "var(--gold)");
  if(playerData.pillActive && Date.now() < playerData.pillEndTime)
    add(`丹药 ×${getPillRate().toFixed(2)} 剩${fmtTime(playerData.pillEndTime-Date.now())}`, "var(--green)");
  if(playerData.sect){
    const s = sectConfig.find(x=>x.id===playerData.sect);
    add(s.name, s.color);
  }
  if(playerData.guild){
    const g = guildCfg();
    add(g.name + "·" + guildRankConfig[guildRankIndex()].name, g.color);
  }
  if(playerData.mentor){
    const m = mentorConfig.find(x=>x.id===playerData.mentor.id);
    if(m) add("师承·" + m.name, m.color);
  }
  if(playerData.origin) add(playerData.origin.icon + playerData.origin.name, playerData.origin.color);
  if(playerData.artifactId){
    const a = artifactConfig.find(x=>x.id===playerData.artifactId);
    if(a) add(`${a.name} ${playerData.artifactLv}阶`, a.color);
  }
  if(playerData.insight > 0) add(`感悟 ${playerData.insight}`, "var(--purple)");
  add(`仙材 ${fmt(playerData.material)}`, "var(--muted)");
  add(`丹渣 ${playerData.dregs}`, "var(--muted)");
  add(`气运值 ${playerData.luckPoints}`, "var(--muted)");
}

/* ============================================================
 *  十八、主循环与启动
 * ============================================================ */
let _saveAcc = 0;
let _started = false;

function gameTick(){
  if(!_started) return;
  try{
    checkDailyReset();
    tickOnlineTime();
    regenStamina();
    checkExploreComplete();
    checkLuck();

    // 在线灵力产出
    playerData.spirit += getSpiritPerSec();

    // 丹药到期
    if(playerData.pillActive && Date.now() > playerData.pillEndTime) playerData.pillActive = false;

    checkRandomEvent();
    checkAchievement();
    checkConstitution();

    updateHeader();
    renderUI();

    _saveAcc++;
    if(_saveAcc >= 5){ _saveAcc = 0; saveSave(); }
  }catch(e){
    console.error("tick error", e);
  }
}

function buildQiField(){
  const field = document.getElementById("qiField");
  if(!field) return;
  const n = 22;
  for(let i=0;i<n;i++){
    const d = el("div","qi" + (Math.random()<0.4?" cyan":""));
    const size = 4 + Math.random()*10;
    d.style.width = size + "px";
    d.style.height = size + "px";
    d.style.left = (Math.random()*100) + "%";
    d.style.animationDuration = (7 + Math.random()*9) + "s";
    d.style.animationDelay = (Math.random()*8) + "s";
    field.appendChild(d);
  }
}

function enterGame(){
  const sp = document.getElementById("splash");
  if(sp){
    sp.style.opacity = "0";
    setTimeout(()=>{ sp.style.display = "none"; }, 400);
  }
  _started = true;
  // 新手礼包
  if(!playerData._welcomed){
    playerData._welcomed = true;
    playerData.spirit += 200;
    playerData.material += 100;
    setTimeout(()=>toast("初入仙道，赠灵力 200 · 仙材 100"), 600);
  }
  renderUI();
}

function boot(){
  buildQiField();
  loadSave(()=>{
    if(playerData._offlineGain && playerData._offlineGain > 1){
      setTimeout(()=>toast(`离线修行所得 ${fmt(playerData._offlineGain)} 灵力`), 900);
    }
    buildTabs();
    renderUI();
    updateHeader();
    _started = true;
    setInterval(gameTick, 1000);
    window.addEventListener("beforeunload", saveSave);
    document.addEventListener("visibilitychange", ()=>{
      if(document.hidden) saveSave();
      else playerData.onlineTickLast = Date.now();
    });
  });
}

window.addEventListener("DOMContentLoaded", boot);
</script>
