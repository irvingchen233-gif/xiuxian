<title>挂机修仙录</title>

<style>
  :root{
    --bg:#141019; --panel:#1f1826; --panel2:#2a2133; --line:#3a2f45;
    --gold:#e8c476; --gold2:#c9a24e; --text:#e9e2d6; --muted:#9a8fa3;
    --green:#7ccd7c; --blue:#6495ed; --purple:#9932cc; --orange:#ff8c00; --red:#e06c6c;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 800px at 50% -10%, #2b2135, var(--bg));
    color:var(--text); font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    max-width:680px;margin:0 auto; min-height:100%; padding-bottom:84px;
    overflow-x:hidden;
  }
  header{padding:14px 16px 10px; position:sticky; top:0; background:linear-gradient(180deg,#1a1420 88%,rgba(26,20,32,0)); z-index:10}
  .title{font-size:18px;font-weight:700;color:var(--gold);letter-spacing:2px}
  .stat-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;flex:1;min-width:110px}
  .stat .k{font-size:11px;color:var(--muted)}
  .stat .v{font-size:16px;font-weight:700;margin-top:2px}
  .buffs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .buff{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line)}
  main{padding:0 16px}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:7px 13px;border-radius:16px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--muted);cursor:pointer}
  .tab.active{background:var(--gold2);color:#1a1420;border-color:var(--gold);font-weight:700}
  .view{display:none}
  .view.active{display:block}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
  .card h3{font-size:14px;color:var(--gold);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .fold{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
  .fold-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;user-select:none}
  .fold-head:hover{background:var(--panel2)}
  .fold-head .ft{font-size:14px;font-weight:600;color:var(--gold)}
  .fold-head .arrow{color:var(--muted);transition:transform .2s;font-size:12px}
  .fold.open .fold-head .arrow{transform:rotate(90deg)}
  .fold-body{padding:0 12px 12px}
  .fold:not(.open) .fold-body{display:none}
  .fold .card{margin-bottom:6px;border:none;background:transparent;padding:6px 2px}
  .scroll-box{max-height:320px;overflow-y:auto;padding-right:4px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);gap:10px}
  .row:last-child{border-bottom:none}
  .row .info{flex:1;min-width:0}
  .row .name{font-size:14px}
  .row .desc{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5}
  .btn{flex:0 0 auto;border:none;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;background:var(--panel2);color:var(--text);border:1px solid var(--line);font-family:inherit}
  .btn.gold{background:var(--gold2);color:#1a1420;font-weight:700;border-color:var(--gold)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
  .num{font-variant-numeric:tabular-nums}
  footer{position:fixed;bottom:0;left:0;right:0;background:#1a1420;border-top:1px solid var(--line);padding:10px 16px;text-align:center;font-size:11px;color:var(--muted);z-index:20}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#000d;border:1px solid var(--gold);color:var(--text);padding:10px 16px;border-radius:10px;font-size:13px;z-index:999;max-width:80%;text-align:center;line-height:1.5}
  .bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:4px}
  .bar>i{display:block;height:100%;background:var(--gold);border-radius:4px;transition:width .3s}
  .npc{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
  .npc:last-child{border-bottom:none}
  .npc-avatar{flex:0 0 46px;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--panel2);border:1px solid var(--line)}
  .npc-body{flex:1;min-width:0}
  .npc-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .npc-name{font-size:14px;font-weight:700}
  .npc-title{font-size:11px;color:var(--muted)}
  .npc-aff{font-size:11px;color:var(--gold);flex:0 0 auto}
  .npc-line{font-size:12px;color:var(--text);margin:6px 0;line-height:1.6;min-height:18px}
  .npc-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .npc-actions .btn{padding:6px 10px;font-size:12px}
  .aff-bar{height:4px;background:var(--panel2);border-radius:3px;margin-top:5px;overflow:hidden}
  .aff-bar>i{display:block;height:100%;background:var(--green);border-radius:3px}
  .zone{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
  .zone:last-child{border-bottom:none}
  .zone-icon{flex:0 0 46px;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--panel2);border:1px solid var(--line)}
  .zone-body{flex:1;min-width:0}
  .zone-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .zone-name{font-size:14px;font-weight:700}
  .zone-risk{font-size:11px;padding:2px 7px;border-radius:6px;border:1px solid currentColor}
  .zone-desc{font-size:12px;color:var(--muted);margin:4px 0;line-height:1.5}
  .zone-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .zone-actions .btn{padding:6px 10px;font-size:12px}
  .stamina-bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:6px 0}
  .stamina-bar>i{display:block;height:100%;background:var(--blue);border-radius:4px;transition:width .3s}
  .log{font-size:12px;color:var(--muted);line-height:1.7}
  .log div{padding:3px 0;border-bottom:1px dashed var(--line)}
  .log div:last-child{border-bottom:none}
  .prog-bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:6px 0}
  .prog-bar>i{display:block;height:100%;background:var(--purple);border-radius:4px;transition:width .3s}
  .modal-mask{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
  .modal{background:var(--panel);border:1px solid var(--gold);border-radius:14px;max-width:440px;width:100%;padding:16px;max-height:82vh;overflow-y:auto}
  .modal h3{color:var(--gold);font-size:16px;margin-bottom:8px}
  .modal-desc{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:12px}
  .sect-opt{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel2)}
  .sect-opt.locked{opacity:.55}
  .sect-icon{flex:0 0 40px;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--panel)}
  .sect-info{flex:1;min-width:0}
  .sect-name{font-size:14px;font-weight:700}
  .sect-desc{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5}
  .sect-mat{font-size:11px;color:var(--gold);margin-top:2px}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
  .battle-log{margin:10px 0;font-size:12px;line-height:1.7;color:var(--muted);max-height:160px;overflow-y:auto}
  .splash{position:fixed;inset:0;z-index:500;overflow:hidden;background:radial-gradient(1200px 800px at 50% -10%, #2b2135, var(--bg));display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .4s}
  .qi-field{position:absolute;inset:0;pointer-events:none}
  .qi{position:absolute;bottom:-40px;border-radius:50%;background:radial-gradient(circle, rgba(232,196,118,.95), rgba(232,196,118,0));filter:blur(1px);box-shadow:0 0 12px 2px rgba(232,196,118,.35);animation:qiFloat linear infinite}
  .qi.cyan{background:radial-gradient(circle, rgba(124,205,124,.9), rgba(124,205,124,0));box-shadow:0 0 12px 2px rgba(124,205,124,.3)}
  @keyframes qiFloat{
    0%{transform:translate3d(0,0,0) scale(.6);opacity:0}
    12%{opacity:.9}
    50%{transform:translate3d(24px,-50vh,0) scale(1);opacity:.65}
    100%{transform:translate3d(-16px,-108vh,0) scale(.8);opacity:0}
  }
  .splash-inner{position:relative;z-index:2;text-align:center;max-width:320px;width:100%}
  .splash-logo{font-size:56px;margin-bottom:18px}
  .splash-title{font-size:34px;font-weight:800;color:var(--gold);letter-spacing:6px;margin-bottom:12px;text-shadow:0 2px 12px rgba(232,196,118,.3)}
  .splash-sub{color:var(--muted);font-size:14px;letter-spacing:3px;margin-bottom:34px}
  .splash-btn{width:100%;padding:13px 0;font-size:16px;letter-spacing:4px}
  .empty{font-size:12px;color:var(--muted);padding:10px 0;text-align:center}
  .tag{font-size:11px;padding:2px 7px;border-radius:6px;margin-left:6px;border:1px solid currentColor}
</style>
</head>

/* ============================================================

function el(tag, cls, id){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(id) e.id = id;
  return e;
}
let _toastTimer = null;
function toast(msg){
  let t = document.getElementById("toastBox");
  if(!t){
    t = el("div","toast"); t.id = "toastBox";
    t.style.display = "none";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>{ t.style.display = "none"; }, 2400);
}
function fmt(n){
  n = Math.floor(n);
  if(!isFinite(n)) return "0";
  if(n < 10000) return n.toString();
  const units = ["万","亿","兆"];
  let u = -1, v = n;
  while(v >= 10000 && u < units.length-1){ v /= 10000; u++; }
  return v.toFixed(v<10?2:v<100?1:0) + units[u];
}
function fmtDur(sec){
  sec = Math.floor(sec);
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60);
  if(h>0) return `${h}时${m}分`;
  if(m>0) return `${m}分${sec%60}秒`;
  return `${sec}秒`;
}
function fmtTime(ms){
  const s = Math.max(0, Math.ceil(ms/1000));
  const m = Math.floor(s/60), sec = s%60;
  return m + "分" + sec + "秒";
}
function randInt(arr){ return Math.floor(arr[0] + Math.random()*(arr[1]-arr[0]+1)); }

/* 折叠面板（带展开状态记忆） */
function foldPanel(id, title, renderBody, defaultOpen){
  const isOpen = playerData.foldState[id] !== undefined ? !!playerData.foldState[id] : !!defaultOpen;
  const wrap = el("div","fold" + (isOpen?" open":""));
  const head = el("div","fold-head");
  const t = el("div","ft"); t.textContent = title;
  const arrow = el("div","arrow"); arrow.textContent = "▶";
  head.appendChild(t); head.appendChild(arrow);
  head.onclick = ()=>{
    playerData.foldState[id] = !isOpen;
    renderUI();
  };
  wrap.appendChild(head);
  const body = el("div","fold-body");
  if(isOpen) renderBody(body);
  wrap.appendChild(body);
  return wrap;
}

const hasAPI = typeof window.H5API !== "undefined" && window.H5API;

function saveSave(){
  playerData.lastLeaveTime = Date.now();
  const str = JSON.stringify(playerData);
  if(hasAPI){
    try{ H5API.setStorage(str, function(res){ if(res && res.code!==0) console.warn("存档失败", res); }); }catch(e){}
  }else{
    try{ localStorage.setItem("xiuxian_save", str); }catch(e){}
  }
}

function loadSave(cb){
  const done = ()=>{ afterLoad(); cb && cb(); };
  if(hasAPI){
    try{
      H5API.getStorage(function(res){
        if(res && res.code===0 && res.data){
          try{ playerData = Object.assign(defaultData(), JSON.parse(res.data)); }catch(e){ playerData = defaultData(); }
        }
        done();
      });
      return;
    }catch(e){}
  }
  try{
    const raw = localStorage.getItem("xiuxian_save");
    if(raw) playerData = Object.assign(defaultData(), JSON.parse(raw));
  }catch(e){}
  done();
}

function getReincTotalRate(){
  let total = 1.0;
  for(let i=1;i<=playerData.reincCount;i++) total *= reincConfig[i].rate;
  return total * constitutionBonus("reinc");
}
function realmSwordCap(){ return realmPassiveOn("heti")?15:10; }
function realmBodyCap(){ return realmPassiveOn("heti")?20:15; }
function swordStack(){ return Math.min(realmSwordCap(), Math.floor(playerData.swordOnlineAcc/60)); }
function bodyStack(){ return Math.min(realmBodyCap(), Math.floor(playerData.bodyOnlineAcc/3600)); }

function sectOnlineRate(){
  switch(playerData.sect){
    case "sword": return 1.12 * (1 + swordStack()*0.02);
    case "body":  return 1.00;
    case "demon": return 1.00;
    case "law":   return 1.06;
    default: return 1.00;
  }
}
function sectOfflineRate(){
  switch(playerData.sect){
    case "sword": return 1.00;
    case "body":  return 1.25 * (1 + bodyStack()*0.02);
    case "demon": return 0.85;
    case "law":   return 1.06;
    default: return 1.00;
  }
}
function sectMatRate(){ return playerData.sect==="body"?1.50:1.00; }
function sectSecretRate(){ return playerData.sect==="demon"?1.50:1.00; }
function sectSkillBoost(){ return playerData.sect==="law" ? (1 + 0.02*playerData.skillUnlocked.length) : 1.00; }

function heritageRate(id){
  const cfg = heritageConfig.find(h=>h.id===id);
  const lv = (playerData.heritage && playerData.heritage[id])||0;
  return 1 + (cfg?cfg.per:0)*lv;
}
function matGlobalRate(){ return sectMatRate() * heritageRate("mat") * guildRate("mat"); }
function adRewardRate(){ return heritageRate("ad"); }
function luckCostDiscount(){ return 2*((playerData.heritage&&playerData.heritage.luck)||0); }

function guildCfg(){ return guildConfig.find(g=>g.id===playerData.guild); }
function guildRate(key){ const g = guildCfg(); return (g && g[key]) || 1.0; }
function guildLuckRate(){ return guildRate("luck"); }
function guildDregRate(){ return guildRate("dreg"); }
function guildRankIndex(){
  let idx = 0;
  for(let i=0;i<guildRankConfig.length;i++)
    if(playerData.guildContribEarned >= guildRankConfig[i].earned) idx = i;
  return idx;
}
function guildRankRate(){ return guildRankConfig[guildRankIndex()].rate; }

function constitutionBonus(key){
  let r = 1;
  for(const id of playerData.constitution){
    const c = constitutionConfig.find(x=>x.id===id);
    if(c && c[key]) r *= c[key];
  }
  return r;
}

function realmPassiveOn(k){ return !!(playerData.realmPassive && playerData.realmPassive[k]); }
function realmLuckRate(){ return realmPassiveOn("huashen")?1.20:1.0; }
function realmDregRate(){ return realmPassiveOn("heti")?1.15:1.0; }
function realmGlobalRate(){ return realmPassiveOn("dacheng")?1.10:1.0; }
function realmSecretFloorRate(){ return realmPassiveOn("lianxu")?1.12:1.0; }
function realmLuckCostCut(){ return realmPassiveOn("lianxu")?0.25:0; }
function realmSweepBonus(){ return realmPassiveOn("dacheng")?1:0; }

function mentorOnlineMult(){
  if(!playerData.mentor) return 1;
  const m = mentorConfig.find(x=>x.id===playerData.mentor.id);
  if(!m) return 1;
  const bondBonus = 1 + ((playerData.mentor.bond||0)/100)*0.05;
  return m.mult * bondBonus;
}

function getSkillTotalRate(){
  let r = 1.0;
  for(const idx of playerData.skillUnlocked) r *= skillConfig[idx].rate;
  return r * sectSkillBoost() * guildRate("skill") * constitutionBonus("skill");
}
function getEquipRate(){
  let total = 1.0;
  for(let i=0;i<equipConfig.length;i++){
    const lv = playerData.equipLv[i]||0;
    if(lv<=0) continue;
    const cfg = equipConfig[i];
    total *= cfg.base + cfg.step*(lv-1);
  }
  return total;
}
function getArtifactRate(){
  if(!playerData.artifactId || playerData.artifactLv<=0) return 1.0;
  const cfg = artifactConfig.find(a=>a.id===playerData.artifactId);
  if(!cfg) return 1.0;
  return cfg.base + cfg.step*(playerData.artifactLv-1);
}
function getWeaponRate(){
  let total = 1.0;
  for(const w of playerData.weapons) total *= w.rate;
  return total;
}
function getDexItemRate(){
  let total = 1.0;
  for(const idx of playerData.dexCollected) total *= dexConfig[idx].rate;
  return total;
}
function getDexMilestone(){
  const n = playerData.dexCollected.length;
  let rate = 1.0, title = dexMilestone[0].title;
  for(const m of dexMilestone){ if(n>=m.count){ rate=m.rate; title=m.title; } }
  return {rate, title};
}
function getDexTotalRate(){ return getDexItemRate() * getDexMilestone().rate; }

function getPillRate(){
  if(!playerData.pillActive) return 1.0;
  if(Date.now() > playerData.pillEndTime){ playerData.pillActive = false; return 1.0; }
  return pillConfig[playerData.pillIndex].rate * heritageRate("pill") * guildRate("pill");
}

function getSpiritPerSec(){
  const base = levelConfig[playerData.level].spiritPerSec;
  return base
    * getReincTotalRate()
    * rootConfig[playerData.rootIndex].rate
    * getSkillTotalRate()
    * getEquipRate()
    * getArtifactRate()
    * getWeaponRate()
    * getDexTotalRate()
    * sectOnlineRate()
    * guildRate("online")
    * guildRankRate()
    * constitutionBonus("online")
    * constitutionBonus("all")
    * realmGlobalRate()
    * mentorOnlineMult()
    * originMod("online")
    * luckConfig[playerData.luckIndex].rate
    * getPillRate();
}
function getOfflineRate(){
  return getReincTotalRate()
    * rootConfig[playerData.rootIndex].rate
    * getSkillTotalRate()
    * getEquipRate()
    * getArtifactRate()
    * getWeaponRate()
    * getDexTotalRate()
    * sectOfflineRate()
    * guildRate("offline")
    * guildRankRate()
    * constitutionBonus("offline")
    * constitutionBonus("all")
    * realmGlobalRate()
    * originMod("offline")
    * heritageRate("offline");
}

function getCombatPower(){
  const base = levelConfig[playerData.level].spiritPerSec * 100;
  const mult = getReincTotalRate()
    * rootConfig[playerData.rootIndex].rate
    * getSkillTotalRate()
    * getEquipRate()
    * getArtifactRate()
    * getWeaponRate()
    * getDexTotalRate()
    * sectOnlineRate()
    * guildRankRate()
    * constitutionBonus("all")
    * realmGlobalRate();
  const st = totalStats();
  return Math.floor(base * mult + st.atk*10 + st.def*8 + st.hp*2);
}

/* ============================================================
 *  六、装备 / 功法 / 灵宠 / 属性
 * ============================================================ */
function rollQuality(power){
  const w = [45, 30, 16, 7, 2].map((x,i)=> x * Math.pow(0.75+power, i));
  const sum = w.reduce((a,b)=>a+b,0);
  let r = Math.random()*sum;
  for(let i=0;i<w.length;i++){ r-=w[i]; if(r<=0) return i; }
  return 0;
}
function genEquip(slotId, power){
  const q = rollQuality(power);
  const elx = elementConfig[Math.floor(Math.random()*elementConfig.length)].id;
  const lv = playerData.level;
  const m = qualityConfig[q].mult;
  let atk=0, def=0, hp=0;
  const slot = equipSlots.find(s=>s.id===slotId);
  if(slot.main==="atk")      atk = Math.floor((8+lv*3)*m);
  else if(slot.main==="def") def = Math.floor((5+lv*2)*m);
  else if(slot.main==="hp")  hp  = Math.floor((30+lv*10)*m);
  else { atk=Math.floor((3+lv*1)*m); def=Math.floor((3+lv*1)*m); hp=Math.floor((12+lv*4)*m); }
  const pool = equipNamePool[slotId];
  const name = pool[Math.floor(Math.random()*pool.length)];
  return { uid: playerData.equipUid++, slot:slotId, name, quality:q, element:elx, atk, def, hp, levelReq:lv };
}
function equippedList(){ return equipSlots.map(s=>playerData.loadout[s.id]).filter(Boolean); }
function skillLevel(i){ return playerData.battleSkillLv[i]||1; }
function battleSkillBonus(){
  const i = playerData.battleSkill;
  if(i<0 || !playerData.battleSkillUnlocked.includes(i)) return {atk:0, def:0, hp:0, rate:1};
  const c = battleSkillConfig[i];
  const lv = skillLevel(i);
  const mult = 1 + 0.1*(lv-1);
  return {
    atk: Math.round(c.atk*mult), def: Math.round(c.def*mult),
    hp: Math.round(c.hp*mult), rate: c.rate + 0.01*(lv-1)
  };
}
function petBonus(){
  if(playerData.activePet<0 || !playerData.pets.includes(playerData.activePet)) return {atk:0, def:0, hp:0};
  const p = petConfig[playerData.activePet];
  return {atk:p.atk, def:p.def, hp:p.hp};
}
function totalStats(){
  const b = { atk:20+playerData.level*15, def:10+playerData.level*8, hp:100+playerData.level*60 };
  const bs = battleSkillBonus();
  const pb = petBonus();
  const ob = originBonus();
  let a=0,d=0,h=0;
  for(const e of equippedList()){ a+=e.atk; d+=e.def; h+=e.hp; }
  return { atk:b.atk+a+bs.atk+pb.atk+ob.atk, def:b.def+d+bs.def+pb.def+ob.def, hp:b.hp+h+bs.hp+pb.hp+ob.hp };
}
function charElement(){
  const count = {metal:0,wood:0,water:0,fire:0,earth:0};
  for(const e of equippedList()) count[e.element]++;
  let best = playerData.element, bestN = 0;
  for(const k in count){ if(count[k]>bestN){ best=k; bestN=count[k]; } }
  return best;
}
function elementBonus(attacker, defender){
  if(elementKe[attacker]===defender) return 1.20;
  if(elementKe[defender]===attacker) return 0.85;
  return 1.0;
}
function equipStatText(e){
  const p = [];
  if(e.atk) p.push(`攻 ${e.atk}`);
  if(e.def) p.push(`防 ${e.def}`);
  if(e.hp)  p.push(`血 ${e.hp}`);
  return p.join(" · ") || "无属性";
}
function gainInsight(n, why){
  if(n<=0) return;
  playerData.insight += n;
  if(why) toast(`感悟 +${n}（${why}）`);
}
function artifactMatCost(lv){ return Math.floor(500*Math.pow(1.85, lv)); }
function artifactDregCost(lv){ return Math.floor(30*Math.pow(1.6, lv)); }
function artifactLuckCost(lv){ return lv>=6 ? Math.floor(10*lv) : 0; }
function artifactOreCost(lv){ return lv>=4 ? (lv-2) : 0; }

/* ============================================================
 *  七、随机 / 气运 / 离线
 * ============================================================ */
function rollWeighted(config, key){
  key = key || "weight";
  let total = 0;
  for(const c of config) total += c[key];
  let r = Math.random()*total, sum = 0;
  for(let i=0;i<config.length;i++){ sum += config[i][key]; if(r<=sum) return i; }
  return 0;
}
function rollOneRoot(){ return rollWeighted(rootConfig,"weight"); }
function rollAdRoot(){ return rollWeighted(rootConfig,"adWeight"); }

function checkLuck(){
  const now = Date.now();
  if(playerData.luckLockedUntil > now) return;
  if(playerData.luckEndTime <= now){
    playerData.luckIndex = rollWeighted(luckConfig);
    playerData.luckEndTime = now + 30*60*1000;
  }
}
function drawLuckCost(){ return Math.max(1, Math.floor((SETTING.luckDrawCost - luckCostDiscount()) * (1 - realmLuckCostCut()))); }
function lockLuckCost(){ return Math.max(1, Math.floor((SETTING.luckLockCost - luckCostDiscount()) * (1 - realmLuckCostCut()))); }

function calcOfflineGain(){
  if(playerData.lastLeaveTime <= 0){ playerData.lastLeaveTime = Date.now(); return; }
  const now = Date.now();
  const deltaSec = Math.max(0, (now - playerData.lastLeaveTime)/1000);
  const realSec = Math.min(deltaSec, SETTING.maxOfflineHour*3600);
  if(realSec <= 0) return;
  const gain = levelConfig[playerData.level].spiritPerSec * getOfflineRate() * realSec;
  playerData.spirit += gain;
  playerData._offlineGain = gain;
  playerData.lastLeaveTime = now;
}

 * ============================================================ */
function checkDailyReset(){
  const today = new Date().getDate();
  if(playerData.dailyResetDay !== today){
    playerData.dailyResetDay = today;
    playerData.dailyProgress = [0,0,0,0,0];
    playerData.dailyClaimed = [false,false,false,false,false];
    playerData.onlineAcc = 0;
    playerData.npcDailyGifted = {};
    playerData.adStaminaToday = 0;
    playerData.sweepToday = 0;
    playerData.adSweepToday = 0;
    playerData.guildQuestDone = false;
    playerData.eventTodayCount = 0;
    playerData.adTribToday = 0;
    playerData.mentorAskToday = 0;
    playerData.adSpeedToday = 0;
    playerData.adSecretToday = 0;
    playerData.secretTodayCount = SETTING.secretFreeCount;
  }
}
function tickOnlineTime(){
  const now = Date.now();
  const delta = Math.floor((now - playerData.onlineTickLast)/1000);
  playerData.onlineTickLast = now;
  if(delta<=0) return;
  playerData.onlineAcc += delta;
  playerData.totalOnlineSec += delta;
  if(playerData.dailyProgress[0] < dailyTaskConfig[0].target)
    playerData.dailyProgress[0] = Math.min(playerData.onlineAcc, dailyTaskConfig[0].target);
  if(playerData.sect==="sword") playerData.swordOnlineAcc += delta;
  if(playerData.sect==="body") playerData.bodyOnlineAcc += delta;
  playerData.luckAccSec += delta;
  const per = SETTING.luckPerOnlineSec;
  while(playerData.luckAccSec >= per){
    playerData.luckAccSec -= per;
    playerData.luckPoints += 1;
  }
  apprenticeFeedback();
}

function checkAchievement(){
  for(const cfg of achievementConfig){
    if(playerData.achCompleted.includes(cfg.id)) continue;
    let ok = false;
    switch(cfg.type){
      case "cultivate":
        if(cfg.id===0 && playerData.level>=1) ok=true;
        if(cfg.id===1 && playerData.level>=5) ok=true;
        if(cfg.id===2 && playerData.level>=9) ok=true;
        if(cfg.id===3 && playerData.level>=13) ok=true;
        if(cfg.id===12 && playerData.level>=29) ok=true;
        break;
      case "secret":
        if(cfg.id===4 && playerData.secretMaxFloor>=3) ok=true;
        if(cfg.id===5 && playerData.secretMaxFloor>=7) ok=true;
        if(cfg.id===6 && playerData.secretMaxFloor>=10) ok=true;
        break;
      case "reinc":
        if(cfg.id===7 && playerData.reincCount>=1) ok=true;
        if(cfg.id===8 && playerData.reincCount>=3) ok=true;
        break;
      case "collect":
        if(cfg.id===9 && playerData.washRootTotal>=5) ok=true;
        if(cfg.id===10 && playerData.skillUnlocked.length>=8) ok=true;
        if(cfg.id===11 && (playerData.equipLv[0]>=5||playerData.equipLv[1]>=5||playerData.equipLv[2]>=5)) ok=true;
        if(cfg.id===13 && !!playerData.artifactId) ok=true;
        break;
      case "trib":
        if(cfg.id===14 && playerData.tribWin>=3) ok=true;
        break;
    }
    if(ok) playerData.achCompleted.push(cfg.id);
  }
}

function constitutionUnlocked(c){ return playerData.constitution.includes(c.id); }
function constitutionProgress(c){
  switch(c.cond.type){
    case "secret":    return Math.min(playerData.secretMaxFloor, c.cond.target);
    case "onlineSec": return Math.min(playerData.totalOnlineSec, c.cond.target);
    case "washRoot":  return Math.min(playerData.washRootTotal, c.cond.target);
    case "makePill":  return Math.min(playerData.pillMadeTotal, c.cond.target);
    case "reinc":     return Math.min(playerData.reincCount, c.cond.target);
    case "guild":     return playerData.guild ? 1 : 0;
  }
  return 0;
}
function checkConstitution(){
  for(const c of constitutionConfig){
    if(constitutionUnlocked(c)) continue;
    if(constitutionProgress(c) >= c.cond.target){
      playerData.constitution.push(c.id);
      toast(`解锁特殊体质【${c.name}】！`);
    }
  }
}

function joinGuild(id){

  if(playerData.level < 1){ toast("抵达炼气一层后方可加入宗门"); return; }

function guildQuestHook(type){
  const g = guildCfg();
  if(!g || playerData.guildQuestDone) return;
  if(g.quest !== type) return;
  playerData.guildQuestDone = true;
  const before = guildRankIndex();
  playerData.guildContrib += GUILD_CONTRIB_REWARD;
  playerData.guildContribEarned += GUILD_CONTRIB_REWARD;
  const after = guildRankIndex();

function buyGuildShop(id){

/* ===== 伙伴 ===== */
function partnerRel(p){
  if(p.relation==="道侣") return "道侣";
  if(p.favor <= -60) return "仇人";
  if(p.favor >= 80) return "挚友";
  if(p.favor < 0)    return "不和";
  return "道友";
}
function partnerRelColor(r){
  return {道友:"var(--muted)", 不和:"var(--orange)", 挚友:"var(--green)", 仇人:"#e06c6c", 道侣:"#f08bb4"}[r] || "var(--muted)";
}
function clampFav(v){ return Math.max(PARTNER_FAV_MIN, Math.min(PARTNER_FAV_MAX, Math.round(v))); }
function getPartner(uid){ return playerData.partners.find(p=>p.uid===uid); }

function meetPartner(){
  const owned = new Set(playerData.partners.map(p=>p.name));
  const pool = partnerNamePool.filter(n=>!owned.has(n.name));
  if(!pool.length) return null;
  const t = pool[Math.floor(Math.random()*pool.length)];
  const p = {uid:playerData.partnerUid++, name:t.name, icon:t.icon, sect:t.sect, note:t.note, favor:10, relation:"道友"};
  playerData.partners.push(p);
  return p;
}
function adjustFav(uid, delta){
  const p = getPartner(uid); if(!p) return;
  p.favor = clampFav(p.favor + delta);
  if(p.relation !== "道侣"){
    if(p.favor <= -60) p.relation = "仇人";
    else if(p.favor >= 80) p.relation = "挚友";
    else if(p.favor < 0) p.relation = "不和";
    else p.relation = "道友";
  }
}
function giftPartner(uid){
  const p = getPartner(uid); if(!p) return;
  if(playerData.material < 50){ toast("仙材不足，无法赠礼"); return; }
  playerData.material -= 50;
  adjustFav(uid, p.favor<0 ? 4 : 8);
  saveSave(); renderUI();
  toast(`赠予【${p.name}】一份仙材，好感 ${p.favor}`);
}
function discussPartner(uid){
  const p = getPartner(uid); if(!p) return;
  const cost = Math.floor(getSpiritPerSec()*30);
  if(playerData.spirit < cost){ toast("灵力不足，论道未成"); return; }
  playerData.spirit -= cost;
  adjustFav(uid, 5);
  saveSave(); renderUI();
  toast(`与【${p.name}】论道一场，好感 ${p.favor}`);
}
function tradePartner(uid){
  const p = getPartner(uid); if(!p) return;
  const rel = partnerRel(p);
  if(rel === "仇人"){ toast("对方与你已成仇人，不愿往来"); return; }
  if(p.favor >= 40){
    const mt = eventMaterialReward(1);
    playerData.material += mt;
    toast(`【${p.name}】念你交好，赠予仙材 ${mt}`);
  }else if(p.favor >= 0){
    if(playerData.material < 80){ toast("仙材不足，交易未成"); return; }
    playerData.material -= 80;
    const sp = eventSpiritReward(120);
    playerData.spirit += sp;
    toast(`互通有无：仙材 -80，灵力 +${fmt(sp)}`);
  }else{
    const loss = Math.floor(playerData.spirit*0.05);
    playerData.spirit -= loss;
    adjustFav(uid, -2);
    toast(`对方借机压价，灵力 -${fmt(loss)}，关系更僵`);
  }
  saveSave(); renderUI();
}
function makeFriend(uid){
  const p = getPartner(uid); if(!p) return;
  if(p.favor < 80){ toast("好感需达 80 方可结为挚友"); return; }
  p.relation = "挚友";
  saveSave(); renderUI();
  toast(`你与【${p.name}】结为挚友`);
}
function makeEnemy(uid){
  const p = getPartner(uid); if(!p) return;
  adjustFav(uid, -30);
  p.relation = "仇人";
  saveSave(); renderUI();
  toast(`你与【${p.name}】反目成仇`);
}
function makeDaoLu(uid){
  const p = getPartner(uid); if(!p) return;
  if(p.favor < 80){ toast("好感需达 80 方可结为道侣"); return; }
  playerData.partners.forEach(q=>{ if(q.relation==="道侣") q.relation = "挚友"; });
  p.relation = "道侣";
  saveSave(); renderUI();
  toast(`你与【${p.name}】结为道侣，携手同行`);
}

const apprenticeNamePool = ["小禾","阿石","青枫","灵素","若尘","阿蛮","萧然","云青"];
function takeApprentice(){
  if(playerData.apprentice) return null;
  const name = apprenticeNamePool[Math.floor(Math.random()*apprenticeNamePool.length)];
  const a = { uid:playerData.partnerUid++, name, icon:"🌱", note:"新入门的少年修士",
              loyalty:50, lastBack:Date.now() };

function apprenticeFeedback(){
  const a = playerData.apprentice;
  if(!a) return;
  const now = Date.now();
  if(!a.lastBack) a.lastBack = now;
  if(now - a.lastBack < 5*60*1000) return;
  a.lastBack = now;
  a.loyalty = Math.min(100, a.loyalty + 1);
  const sp = Math.floor(getSpiritPerSec()*60*(a.loyalty/100)*2);
  playerData.spirit += sp;
  addExploreLog(`弟子【${a.name}】回馈灵力 +${fmt(sp)}`);
}

function npcAff(id){ return playerData.npcAffinity[id]||0; }
function npcRankOf(id){
  const aff = npcAff(id);
  let rank = npcRank[0];
  for(const r of npcRank){ if(aff >= r.need) rank = r; }
  return rank;
}
function npcQuestHook(tab){
  npcConfig.forEach(n=>{
    if(n.questTab === tab) playerData.npcAffinity[n.id] = npcAff(n.id) + 1;
  });
}
function npcTalk(id){
  const n = npcConfig.find(x=>x.id===id); if(!n) return;
  const idx = Math.floor(Math.random()*n.lines.length);
  playerData.npcLine[id] = idx;
  renderUI();
}
function giftNpc(id){
  const n = npcConfig.find(x=>x.id===id); if(!n) return;
  if(playerData.npcDailyGifted[id]){ toast("今日已领过这位道友的赠礼"); return; }
  playerData.npcDailyGifted[id] = true;
  const rank = npcRankOf(id);
  if(n.giftType === "spirit"){
    const sp = Math.floor(getSpiritPerSec()*n.giftBase*rank.mult);
    playerData.spirit += sp;
    toast(`【${n.name}】赠你灵力 ${fmt(sp)}`);
  }else if(n.giftType === "material"){
    const mt = Math.floor(n.giftBase*(1+playerData.level*0.5)*rank.mult*matGlobalRate());
    playerData.material += mt;
    toast(`【${n.name}】赠你仙材 ${mt}`);
  }else{
    // 风险交易
    if(Math.random() < 0.6){
      const mt = Math.floor(200*(1+playerData.level*0.6)*matGlobalRate());
      const dg = 20;
      playerData.material += mt; playerData.dregs += dg;
      toast(`赌赢了！仙材 +${mt}，丹渣 +${dg}`);
      adjustNpc(id, 2);
    }else{
      const loss = Math.floor(playerData.spirit*0.08);
      playerData.spirit -= loss;

      adjustNpc(id, 1);

}
function adjustNpc(id, n){ playerData.npcAffinity[id] = Math.max(0, npcAff(id) + n); }

/* ============================================================
 *  十一、境界与天劫
 * ============================================================ */
let pendingTrib = null;
function tribSuccessRate(){
  const order = [13,17,21,25,29].indexOf(playerData.level+1);
  let rate = SETTING.tribBaseRate - SETTING.tribRateDrop*Math.max(0,order);
  rate += (luckConfig[playerData.luckIndex].rate - 1) * 0.5;
  rate += (playerData.artifactLv||0) * 0.005;
  rate += (constitutionBonus("all") - 1) * 0.5;
  return Math.min(0.95, Math.max(0.20, rate));
}
function levelUp(){
  if(playerData.level >= MAX_PLAYABLE_LEVEL){ toast("已达当前版本顶点，渡劫境开发中"); return; }
  const cfg = levelConfig[playerData.level];
  const nextCfg = levelConfig[playerData.level+1];
  if(nextCfg.locked){ toast("天劫未至，渡劫境暂未开放"); return; }
  if(playerData.spirit < cfg.cost){ toast("灵力不足"); return; }
  const req = nextCfg.req;
  if(req){
    if(playerData.reincCount < req.reinc){ toast(`需累计转生 ${req.reinc} 次`); return; }
    if(playerData.secretMaxFloor < req.secret){ toast(`需通关秘境 ${req.secret} 层`); return; }
    if(playerData.material < req.material){ toast(`仙材不足（需 ${fmt(req.material)}）`); return; }
    if(playerData.dregs < req.dregs){ toast(`丹渣不足（需 ${req.dregs}）`); return; }
    if(req.luck && playerData.luckPoints < req.luck){ toast(`气运值不足（需 ${req.luck}）`); return; }
  }
  if(nextCfg.trib){ pendingTrib = { fromLevel: playerData.level }; openTribModal(); return; }
  applyBreakthrough(playerData.level, req, false, 0);
}
function applyBreakthrough(fromLevel, req, tribSuccess, reward){
  const cfg = levelConfig[fromLevel];
  playerData.spirit -= cfg.cost;
  if(req){
    playerData.material -= req.material;
    playerData.dregs -= req.dregs;
    if(req.luck) playerData.luckPoints -= req.luck;
    if(req.passive) playerData.realmPassive[req.passive] = true;
  }
  playerData.level++;
  if(tribSuccess) playerData.spirit += reward;
  gainInsight(req ? 10 : 2, req ? "大境界突破" : "境界突破");
  checkAchievement();
  checkConstitution();
  saveSave(); renderUI();
  const passiveMsg = req && req.passive ? "，觉醒境界道果！" : "";
  if(tribSuccess) toast(`渡劫成功：${levelConfig[playerData.level].name}${passiveMsg}，渡劫奖励灵力 +${fmt(reward)}`);
  else toast(`突破成功：${levelConfig[playerData.level].name}${passiveMsg}`);
  if(fromLevel===0 && playerData.level===1) setTimeout(showSectIntro, 500);
  if(fromLevel===4 && playerData.level===5 && !playerData.sect) setTimeout(openSectSelect, 500);
}
function resolveTribulation(guarded){
  if(!pendingTrib) return;
  const fromLevel = pendingTrib.fromLevel;
  const nextCfg = levelConfig[fromLevel+1];
  const req = nextCfg.req;
  const success = guarded || Math.random() < tribSuccessRate();
  closeTribModal();
  if(success){
    playerData.tribWin++;
    const reward = Math.floor(getSpiritPerSec()*SETTING.tribRewardSec*2);
    applyBreakthrough(fromLevel, req, true, reward);
  }else{
    const loss = Math.floor(playerData.spirit*SETTING.tribFailLoss);
    playerData.spirit -= loss;
    playerData.tribFail++;
    saveSave(); renderUI();
    toast(`渡劫失败！天雷重创，灵力 -${fmt(loss)}（前置资源未损）`);
  }
  pendingTrib = null;
}
function adGuardTrib(){
  if(playerData.adTribToday >= SETTING.adTribLimit){ toast("今日护持次数已用完"); return; }
  showRewardAd(()=>{ playerData.adTribToday++; resolveTribulation(true); });
}
function closeTribModal(){
  const m = document.getElementById("tribModal");
  if(m) m.remove();
}
function openTribModal(){
  closeTribModal();
  if(!pendingTrib) return;
  const fromLevel = pendingTrib.fromLevel;
  const nextCfg = levelConfig[fromLevel+1];
  const rate = tribSuccessRate();
  const reward = Math.floor(getSpiritPerSec()*SETTING.tribRewardSec*2);
  const left = SETTING.adTribLimit - playerData.adTribToday;
  const mask = el("div","modal-mask"); mask.id = "tribModal";
  const box = el("div","modal");
  box.innerHTML = `<h3 style="color:#ff6b6b">⚡ 天劫降临 · ${nextCfg.name}</h3>
    <div class="modal-desc">
      大境界突破须受天雷洗礼。<br>
      渡劫成功率：<b style="color:var(--gold)">${(rate*100).toFixed(1)}%</b>（气运、本命法宝、体质可提升）<br>
      渡劫成功：突破境界，并获渡劫奖励，灵力 +${fmt(reward)}<br>
      渡劫失败：损失当前灵力 ${Math.round(SETTING.tribFailLoss*100)}%，前置资源不损<br>
      历劫战绩：成功 ${playerData.tribWin} 次 · 失败 ${playerData.tribFail} 次
    </div>`;
  const acts = el("div","modal-actions");
  const laterBtn = el("button","btn"); laterBtn.textContent = "暂缓";
  laterBtn.onclick = ()=>{ closeTribModal(); pendingTrib = null; };
  const guardBtn = el("button","btn gold");
  guardBtn.textContent = left>0 ? `广告护持 · 必成（${left}/${SETTING.adTribLimit}）` : "今日护持已用完";
  guardBtn.disabled = left<=0;
  guardBtn.onclick = adGuardTrib;
  const fightBtn = el("button","btn"); fightBtn.textContent = "强行渡劫";
  fightBtn.onclick = ()=>resolveTribulation(false);
  acts.appendChild(laterBtn); acts.appendChild(guardBtn); acts.appendChild(fightBtn);
  box.appendChild(acts);
  mask.appendChild(box);
  document.body.appendChild(mask);
}

const SECT_MAT_NEED = 3;
function sectMaterialCount(id){ return playerData.sectMaterials[id]||0; }
function closeSectModal(){

/* 秘境 */
function secretRewardAt(floor){
  if(floor < secretConfig.length) return secretConfig[floor].reward;
  const over = floor - secretConfig.length;
  const cycle = Math.floor(over/8);
  const pos = over%8;
  return Math.floor(secretConfig[secretConfig.length-1].reward * Math.pow(8, cycle) * (1 + pos*0.3));
}
function challengeSecret(){
  const next = playerData.secretMaxFloor;
  if(playerData.secretTodayCount <= 0){
    if(playerData.adSecretToday >= SETTING.adSecretDailyLimit){ toast("今日秘境次数已用完"); return; }
    showRewardAd(()=>{
      playerData.adSecretToday++;
      playerData.secretTodayCount++;
      saveSave(); renderUI();
      toast("秘境次数 +1");
    });
    return;
  }
  playerData.secretTodayCount--;
  const floorReward = Math.floor(getSpiritPerSec()*60*realmSecretFloorRate());
  const baseReward = Math.floor(secretRewardAt(next) * sectSecretRate() * heritageRate("secret"));
  let reward = Math.max(baseReward, floorReward);
  let backlash = false;
  if(playerData.sect==="demon" && Math.random()<0.15){
    reward = Math.max(floorReward, Math.floor(reward*0.7));
    backlash = true;
  }
  playerData.spirit += reward;
  let matGain = Math.floor((80 + next*40) * matGlobalRate());
  playerData.material += matGain;

  const dexIdx = dexConfig.findIndex(d=>d.floor===next);
  let repeatMat = 0, newDex = "";
  if(dexIdx>=0){
    if(!playerData.dexCollected.includes(dexIdx)){
      playerData.dexCollected.push(dexIdx);
      playerData.dexGuarantee = false;
      newDex = `、新图鉴【${dexConfig[dexIdx].name}】`;
    }else{
      repeatMat = Math.floor(matGain*0.5);
      playerData.material += repeatMat;
    }
  }
  playerData.luckPoints += Math.floor(SETTING.luckPerSecret * guildLuckRate() * realmLuckRate());
  let equipMsg = "";
  if(Math.random() < 0.35){
    const slot = equipSlots[Math.floor(Math.random()*equipSlots.length)].id;
    const eq = genEquip(slot, Math.min(1, next/32));
    playerData.inventory.push(eq);
    equipMsg = `、拾得${qualityConfig[eq.quality].name}【${eq.name}】`;
  }
  const backMsg = backlash ? "　心魔反噬，灵力折损三成" : "";
  const repMsg = repeatMat>0 ? `　重复图鉴折算仙材 +${repeatMat}` : "";
  toast(`通关秘境${next+1}层！灵力 ${fmt(reward)}、仙材 ${matGain}${newDex}${repMsg}${equipMsg}${backMsg}`);
  playerData.secretMaxFloor = next+1;
  playerData.dailyProgress[1] = Math.min(playerData.dailyProgress[1]+1, dailyTaskConfig[1].target);
  npcQuestHook("秘境");
  guildQuestHook("secret");
  checkAchievement();
  checkConstitution();
  saveSave(); renderUI();
}
function sweepSecret(){
  const freeLimit = SETTING.sweepFreeCount + realmSweepBonus();
  const canFree = playerData.sweepToday < freeLimit;
  const canAd = !canFree && playerData.adSweepToday < SETTING.adSweepLimit;
  if(!canFree && !canAd){ toast("今日扫荡次数已用完"); return; }
  const doSweep = (useAd)=>{
    const floor = Math.max(0, playerData.secretMaxFloor);
    const spiritGain = Math.floor(secretRewardAt(Math.max(0,floor-1))*0.15 * heritageRate("secret"));
    const matGain = Math.floor((60 + floor*30) * matGlobalRate());
    playerData.spirit += spiritGain;
    playerData.material += matGain;
    if(useAd) playerData.adSweepToday++; else playerData.sweepToday++;
    playerData.luckPoints += Math.ceil(SETTING.luckPerSecret/2);
    saveSave(); renderUI();
    toast(`扫荡完成：灵力 ${fmt(spiritGain)}、仙材 ${matGain}`);
  };
  if(canFree) doSweep(false);
  else showRewardAd(()=>doSweep(true));
}
function adDoubleSecretMat(){
  showRewardAd(()=>{
    const matGain = Math.floor((80 + Math.max(0,playerData.secretMaxFloor-1)*40) * matGlobalRate() * adRewardRate());
    playerData.material += matGain;

  if(playerData.spirit < cfg.cost){ toast("灵力不足"); return; }

  playerData.battleSkillUnlocked.push(i);
  playerData.battleSkill = i;
  saveSave(); renderUI();
  toast(`习得战斗功法【${cfg.name}】`);
}
function equipBattleSkill(i){
  if(!playerData.battleSkillUnlocked.includes(i)){ toast("尚未习得"); return; }
  playerData.battleSkill = i;
  saveSave(); renderUI();
  toast(`已装备【${battleSkillConfig[i].name}】`);
}
function upgradeBattleSkill(i){

  if(lv >= BATTLE_SKILL_MAX_LV){ toast("功法已至圆满重数"); return; }

  saveSave(); renderUI();
  toast(`【${battleSkillConfig[i].name}】参悟至第 ${lv+1} 重`);
}
function writeBattleSkill(i){
  if(playerData.battleSkillUnlocked.includes(i)){ toast("已习得"); return; }
  const cfg = battleSkillConfig[i];
  if(playerData.insight < cfg.insightCost){ toast(`感悟不足（需 ${cfg.insightCost} 点）`); return; }
  playerData.insight -= cfg.insightCost;
  playerData.battleSkillUnlocked.push(i);
  playerData.battleSkill = i;

/* 灵宠 */
function recruitPet(i){

  if(playerData.spirit < p.cost){ toast("灵力不足"); return; }

}
function setActivePet(i){

/* 装备操作 */
function equipItem(uid){
  const idx = playerData.inventory.findIndex(e=>e.uid===uid);
  if(idx < 0) return;
  const item = playerData.inventory[idx];
  const old = playerData.loadout[item.slot];
  playerData.loadout[item.slot] = item;
  playerData.inventory.splice(idx,1);
  if(old) playerData.inventory.push(old);
  saveSave(); renderUI();
  toast(`已穿戴【${item.name}】`);
}
function unequipItem(slotId){
  const old = playerData.loadout[slotId];
  if(!old) return;
  playerData.loadout[slotId] = null;
  playerData.inventory.push(old);
  saveSave(); renderUI();
}
function sellItem(uid){
  const idx = playerData.inventory.findIndex(e=>e.uid===uid);
  if(idx < 0) return;
  const it = playerData.inventory[idx];
  const mat = Math.floor((20+it.atk+it.def+it.hp) * qualityConfig[it.quality].mult);
  playerData.material += mat;
  playerData.inventory.splice(idx,1);
  saveSave(); renderUI();
  toast(`出售【${it.name}】，仙材 +${mat}`);
}

/* 本命法宝 */
function forgeArtifact(id){
  const cfg = artifactConfig.find(a=>a.id===id);
  if(!cfg) return;
  if(playerData.artifactId){ toast("已铸就本命法宝"); return; }
  if(playerData.level < cfg.unlockLevel){ toast("需筑基期方可铸就本命法宝"); return; }
  const matCost = 2000, dregCost = 50;
  if(playerData.material < matCost){ toast(`仙材不足（需 ${matCost}）`); return; }
  if(playerData.dregs < dregCost){ toast(`丹渣不足（需 ${dregCost}）`); return; }
  playerData.material -= matCost;
  playerData.dregs -= dregCost;
  playerData.artifactId = id;
  playerData.artifactLv = 1;
  playerData.artifactElement = cfg.element;
  checkAchievement();
  saveSave(); renderUI();
  toast(`本命法宝【${cfg.name}】铸就！`);
}
function upgradeArtifact(){
  if(!playerData.artifactId){ toast("尚无本命法宝"); return; }
  const cfg = artifactConfig.find(a=>a.id===playerData.artifactId);
  if(!cfg) return;
  const lv = playerData.artifactLv;
  if(lv >= cfg.maxLv){ toast("已至最高阶"); return; }
  const mat = artifactMatCost(lv), dreg = artifactDregCost(lv), luck = artifactLuckCost(lv);
  const oreN = artifactOreCost(lv);
  const elx = playerData.artifactElement || cfg.element;
  if(playerData.material < mat){ toast(`仙材不足（需 ${fmt(mat)}）`); return; }
  if(playerData.dregs < dreg){ toast(`丹渣不足（需 ${dreg}）`); return; }
  if(luck && playerData.luckPoints < luck){ toast(`气运值不足（需 ${luck}）`); return; }
  if(oreN > 0 && (playerData.ore[elx]||0) < oreN){ toast(`需【${oreConfig[elx].name}】×${oreN}`); return; }
  playerData.material -= mat;
  playerData.dregs -= dreg;
  if(luck) playerData.luckPoints -= luck;
  if(oreN > 0) playerData.ore[elx] -= oreN;
  playerData.artifactLv++;
  saveSave(); renderUI();
  toast(`本命法宝温养至第 ${playerData.artifactLv} 阶`);
}
function pickupDroppedArtifact(idx){
  const d = playerData.droppedArtifacts[idx];
  if(!d) return;
  if(playerData.artifactId){ toast("已有本命法宝，无法再承一件"); return; }
  playerData.droppedArtifacts.splice(idx,1);
  playerData.artifactId = d.aid;
  playerData.artifactLv = d.lv;
  const cfg = artifactConfig.find(a=>a.id===d.aid);
  playerData.artifactElement = cfg ? cfg.element : "metal";
  saveSave(); renderUI();
  toast(`拾回前世本命【${d.name}】，阶位保留至 ${d.lv} 阶`);
}

/* ============================================================
 *  十四、探险系统
 * ============================================================ */
function addExploreLog(msg){
  playerData.exploreLog.unshift(msg);
  if(playerData.exploreLog.length > 8) playerData.exploreLog.length = 8;
}
function eventSpiritReward(sec){ return Math.floor(getSpiritPerSec()*sec); }
function eventMaterialReward(mult){
  return Math.floor((30+playerData.level*20) * (mult||1) * matGlobalRate());
}
function regenStamina(){
  const now = Date.now();
  const elapsed = Math.floor((now - playerData.staminaLastTick)/1000);
  if(elapsed <= 0) return;
  playerData.staminaLastTick = now;
  if(playerData.stamina >= SETTING.maxStamina) return;
  playerData.staminaAcc = (playerData.staminaAcc||0) + elapsed;
  while(playerData.staminaAcc >= SETTING.staminaRegenSec && playerData.stamina < SETTING.maxStamina){
    playerData.staminaAcc -= SETTING.staminaRegenSec;
    playerData.stamina++;
  }
}
function startExplore(zoneId){
  const z = exploreConfig.find(x=>x.id===zoneId);
  if(!z) return;
  if(playerData.exploreZone){ toast("正在探险中"); return; }
  if(playerData.level < z.unlockLevel){ toast("境界不足，无法前往"); return; }
  if(playerData.stamina < z.staminaCost){ toast("体力不足"); return; }
  playerData.stamina -= z.staminaCost;
  playerData.exploreZone = zoneId;
  playerData.exploreEndTime = Date.now() + z.duration*1000;
  playerData.zoneVisited[zoneId] = (playerData.zoneVisited[zoneId]||0)+1;
  saveSave(); renderUI();
}
function stopExplore(){
  if(!playerData.exploreZone){ toast("当前未在探险"); return; }
  playerData.exploreZone = "";
  playerData.exploreEndTime = 0;
  playerData.autoExplore = false;
  saveSave(); renderUI();
  toast("已中断探险");
}
function toggleAutoExplore(zoneId){
  if(!zoneId){
    playerData.autoExplore = false;
    saveSave(); renderUI();
    return;
  }
  if(playerData.autoExplore && playerData.autoZone === zoneId){
    playerData.autoExplore = false;
  }else{
    playerData.autoExplore = true;
    playerData.autoZone = zoneId;
    if(!playerData.exploreZone) startExplore(zoneId);
  }
  saveSave(); renderUI();
}
function adStamina(){
  if(playerData.adStaminaToday >= SETTING.adStaminaLimit){ toast("今日体力补充次数已用完"); return; }
  showRewardAd(()=>{
    playerData.adStaminaToday++;
    playerData.stamina = Math.min(SETTING.maxStamina, playerData.stamina + 40);
    saveSave(); renderUI();
    toast("体力 +40");
  });
}
function resolveBattle(){
  const st = totalStats();
  const foeLv = Math.max(1, playerData.level);
  let myHp = st.hp, foeHp = 150 + foeLv*55;
  const foeAtk = 15 + foeLv*10, foeDef = 8 + foeLv*6;
  const elBonus = elementBonus(charElement(), elementConfig[foeLv%5].id);
  let rounds = 0;
  while(myHp > 0 && foeHp > 0 && rounds < 60){
    rounds++;
    foeHp -= Math.max(1, Math.floor((st.atk - foeDef*0.5) * elBonus * (0.9+Math.random()*0.2)));
    if(foeHp <= 0) break;
    myHp -= Math.max(1, Math.floor(foeAtk - st.def*0.5));
  }
  return { win: foeHp<=0 && myHp>0, rounds };
}
function settleExplore(z){
  const pool = [];
  for(const k in z.events){ for(let i=0;i<z.events[k];i++) pool.push(k); }
  const ev = pool[Math.floor(Math.random()*pool.length)];
  let msg = "";
  switch(ev){
    case "gather": {
      const sp = eventSpiritReward(randInt(z.spirit));
      const mat = Math.floor(randInt(z.material)*matGlobalRate());
      playerData.spirit += sp; playerData.material += mat;
      msg = `采集灵材 · 灵力 +${fmt(sp)}，仙材 +${mat}`;
      break;
    }
    case "herb": {
      const mat = Math.floor(randInt(z.material)*0.6*matGlobalRate());
      const dg = Math.floor((3+playerData.level*0.6)*guildDregRate()*realmDregRate());
      playerData.material += mat; playerData.dregs += dg;
      msg = `采得灵药 · 仙材 +${mat}，丹渣 +${dg}`;
      break;
    }
    case "beast": {
      const r = resolveBattle();
      if(r.win){
        const sp = eventSpiritReward(Math.floor(randInt(z.spirit)*1.5));
        playerData.spirit += sp;
        msg = `击退妖兽 · 灵力 +${fmt(sp)}`;
      }else{
        const loss = Math.floor(playerData.spirit*0.03);
        playerData.spirit -= loss;
        msg = `不敌妖兽 · 灵力 -${fmt(loss)}`;
      }
      break;
    }
    case "fortune": {
      const n = 2 + Math.floor(Math.random()*3);
      playerData.luckPoints += n;
      gainInsight(2);
      msg = `偶得机缘 · 气运 +${n}，感悟 +2`;
      break;
    }
    case "hazard": {
      const loss = Math.floor(playerData.spirit*0.05);
      playerData.spirit -= loss;
      msg = `遭遇凶险 · 灵力 -${fmt(loss)}`;
      break;
    }
  }
  if(Math.random() < 0.4){
    const o = z.ore || "earth";
    playerData.ore[o] = (playerData.ore[o]||0) + 1;
    msg += `，${oreConfig[o].icon}${oreConfig[o].name} +1`;
  }
  if(Math.random() < 0.22){
    let mid = z.matId;
    if(mid === "random") mid = sectConfig[Math.floor(Math.random()*sectConfig.length)].id;
    playerData.sectMaterials[mid] = (playerData.sectMaterials[mid]||0) + 1;
    const sc = sectConfig.find(s=>s.id===mid);
    msg += `，获得信物【${sc.matName}】×1`;
  }
  addExploreLog(msg);
  guildQuestHook("explore");
  checkConstitution();
  saveSave();
}
function checkExploreComplete(){
  if(!playerData.exploreZone) return;
  if(Date.now() < playerData.exploreEndTime) return;
  const z = exploreConfig.find(x=>x.id===playerData.exploreZone);
  playerData.exploreZone = "";
  playerData.exploreEndTime = 0;
  if(z) settleExplore(z);
  if(playerData.autoExplore && playerData.autoZone){
    const nz = exploreConfig.find(x=>x.id===playerData.autoZone);
    if(nz && playerData.stamina >= nz.staminaCost && playerData.level >= nz.unlockLevel){
      startExplore(playerData.autoZone);
    }else{
      playerData.autoExplore = false;
      addExploreLog("体力不足或境界不够，自动探险已停止");
    }
  }
  renderUI();
}

/* ============================================================
 *  十五、随机奇遇事件
 * ============================================================ */
function checkRandomEvent(){
  if(playerData.eventPending) return;
  if(Date.now() < playerData.eventCooldownUntil) return;
  if(playerData.eventTodayCount >= SETTING.eventDailyLimit) return;
  playerData.eventCheckAcc++;
  if(playerData.eventCheckAcc < SETTING.eventCheckSec) return;
  playerData.eventCheckAcc = 0;
  if(Math.random() > SETTING.eventChance) return;
  triggerRandomEvent();
}
function triggerRandomEvent(){
  const cfg = randomEventConfig[Math.floor(Math.random()*randomEventConfig.length)];
  playerData.eventPending = { id: cfg.id };
  playerData.eventTodayCount++;
  playerData.eventCooldownUntil = Date.now() + SETTING.eventCooldownSec*1000;
  openEventModal();
}
function closeEventModal(){
  const m = document.getElementById("eventModal");
  if(m) m.remove();
}
function openEventModal(){
  closeEventModal();
  if(!playerData.eventPending) return;
  const cfg = randomEventConfig.find(e=>e.id === playerData.eventPending.id);
  if(!cfg){ playerData.eventPending = null; return; }
  const mask = el("div","modal-mask"); mask.id = "eventModal";
  const box = el("div","modal");
  box.innerHTML = `<h3 style="color:${cfg.color}">${cfg.icon} ${cfg.title}</h3>
    <div class="modal-desc">${cfg.desc}</div>`;
  const acts = el("div","modal-actions");
  acts.style.flexDirection = "column";
  acts.style.alignItems = "stretch";
  cfg.options.forEach(opt=>{
    const b = el("button","btn");
    b.style.textAlign = "left";
    b.innerHTML = `<b>${opt.label}</b><div style="font-size:11px;color:var(--muted);margin-top:2px">${opt.desc}</div>`;
    b.onclick = ()=>resolveEventOption(cfg, opt);
    acts.appendChild(b);
  });
  box.appendChild(acts);
  mask.appendChild(box);
  document.body.appendChild(mask);
}
function resolveEventOption(cfg, opt){
  const msgs = applyEventFx(opt.fx || []);
  closeEventModal();
  playerData.eventPending = null;
  saveSave(); renderUI();
  if(msgs.length) toast(msgs.join("　"));
  else toast("此事便如此过去了");
}
function applyEventFx(fxList){
  const msgs = [];
  for(const fx of fxList){
    switch(fx.type){
      case "spirit": {
        const sp = eventSpiritReward(fx.sec);
        playerData.spirit += sp;
        msgs.push(`灵力 +${fmt(sp)}`);
        break;
      }
      case "material": {
        const mt = eventMaterialReward(fx.n);
        playerData.material += mt;
        msgs.push(`仙材 +${mt}`);
        break;
      }
      case "dregs": {
        const d = Math.floor((fx.n||10) * guildDregRate() * realmDregRate());
        playerData.dregs += d;
        msgs.push(`丹渣 +${d}`);
        break;
      }
      case "luck": {
        playerData.luckPoints += fx.n;
        msgs.push(`气运 +${fx.n}`);
        break;
      }
      case "ore": {
        const o = elementConfig[Math.floor(Math.random()*elementConfig.length)].id;
        playerData.ore[o] = (playerData.ore[o]||0) + fx.n;
        msgs.push(`${oreConfig[o].name} +${fx.n}`);
        break;
      }
      case "insight": {
        playerData.insight += fx.n;
        msgs.push(`感悟 +${fx.n}`);
        break;
      }
      case "spendMaterial": {
        if(playerData.material < fx.amt){ msgs.push("仙材不足，未能成事"); break; }
        playerData.material -= fx.amt;
        msgs.push(`仙材 -${fx.amt}`);
        break;
      }
      case "spendDregs": {
        if(playerData.dregs < fx.amt){ msgs.push("丹渣不足，未能成事"); break; }
        playerData.dregs -= fx.amt;
        msgs.push(`丹渣 -${fx.amt}`);
        break;
      }
      case "battle": {
        const r = resolveBattle();
        if(r.win){
          const mt = eventMaterialReward(1.2);
          playerData.material += mt;
          msgs.push(`战斗胜利，仙材 +${mt}`);
        }else{
          const loss = Math.floor(playerData.spirit*0.06);
          playerData.spirit -= loss;
          msgs.push(`战斗失利，灵力 -${fmt(loss)}`);
        }
        break;
      }
      case "trap": {
        if(Math.random() < fx.rate){
          const loss = Math.floor(playerData.spirit*0.08);
          playerData.spirit -= loss;
          msgs.push(`触发陷阱，灵力 -${fmt(loss)}`);
        }
        break;
      }
      case "backlash": {
        if(Math.random() < fx.rate){
          const loss = Math.floor(playerData.spirit*0.10);
          playerData.spirit -= loss;
          msgs.push(`遭遇反噬，灵力 -${fmt(loss)}`);
        }
        break;
      }
      case "meetPartner": {
        const p = meetPartner();
        if(p) msgs.push(`结识【${p.name}】`);
        else msgs.push("再无故人可结");
        break;
      }
      case "pet": {
        const free = petConfig.map((_,i)=>i).filter(i=>!playerData.pets.includes(i));
        if(!free.length){ msgs.push("灵宠栏已满，幼兽自行离去"); break; }
        const idx = free[Math.floor(Math.random()*free.length)];
        playerData.pets.push(idx);
        if(playerData.activePet < 0) playerData.activePet = idx;
        msgs.push(`结缘灵宠【${petConfig[idx].icon}${petConfig[idx].name}】`);
        break;
      }
      case "appointMentor": {
        const m = appointMentor();
        if(m) msgs.push(`拜入【${m.name}】门下`);
        else msgs.push("已有师门");
        break;
      }
      case "takeApprentice": {
        const a = takeApprentice();
        if(a) msgs.push(`收【${a.name}】为弟子`);
        else msgs.push("已有弟子在侧");
        break;
      }
      case "relicWeapon": {
        const cfgA = artifactConfig[Math.floor(Math.random()*artifactConfig.length)];
        const w = { aid:cfgA.id, name:cfgA.name, icon:cfgA.icon, color:cfgA.color,
                    rate: 1 + (0.02 + Math.random()*0.03) };
        playerData.weapons.push(w);
        msgs.push(`重炼兵器【${w.name}】，产出 ×${w.rate.toFixed(3)}`);
        break;
      }
    }
  }
  return msgs;
}

/* ============================================================
 *  十六、视图渲染
 * ============================================================ */
let currentTab = "cultivate";
const TABS = [
  {id:"cultivate", name:"修行"},
  {id:"secret",    name:"秘境"},
  {id:"explore",   name:"探险"},
  {id:"encounter", name:"奇遇"},
  {id:"grow",      name:"养成"},
  {id:"sect",      name:"宗门"},
  {id:"reinc",     name:"转生"},
];

function buildTabs(){
  const nav = document.getElementById("tabs");
  if(!nav) return;
  nav.innerHTML = "";
  TABS.forEach(t=>{
    const d = el("div","tab" + (currentTab===t.id?" active":""));
    d.textContent = t.name;
    d.onclick = ()=>{
      if(currentTab === t.id) return;
      currentTab = t.id;
      renderUI();
      window.scrollTo({top:0, behavior:"smooth"});
    };
    nav.appendChild(d);
  });
}

function renderUI(){
  if(!playerData) return;
  buildTabs();
  const container = document.getElementById("views");
  if(!container) return;
  const scrolls = [];
  container.querySelectorAll(".scroll-box").forEach(b=>scrolls.push(b.scrollTop));
  container.innerHTML = "";
  const view = el("section","view active");
  view.id = "view-" + currentTab;
  const fn = VIEW_RENDERERS[currentTab];
  if(fn){
    try{ fn(view); }catch(e){ console.error(e); view.textContent = "渲染出错：" + e.message; }
  }
  container.appendChild(view);
  container.querySelectorAll(".scroll-box").forEach((b,i)=>{ if(scrolls[i]!=null) b.scrollTop = scrolls[i]; });
  updateHeader();
}

/* ===== 通用小工具 ===== */
function mkCard(title, rightText){
  const c = el("div","card");
  if(title){
    const h = el("h3");
    h.textContent = title;
    if(rightText){
      const r = el("span");
      r.style.cssText = "font-weight:400;font-size:12px;color:var(--muted)";
      r.textContent = rightText;
      h.appendChild(r);
    }
    c.appendChild(h);
  }
  return c;
}
function mkBar(cur, max, cls){
  const b = el("div", cls || "prog-bar");
  const i = el("i");
  i.style.width = Math.max(0, Math.min(100, max>0 ? cur/max*100 : 0)) + "%";
  b.appendChild(i);
  return b;
}
function mkRow(name, desc, btnText, btnCls, onBtn, disabled){
  const r = el("div","row");
  const info = el("div","info");
  const n = el("div","name"); n.innerHTML = name;
  info.appendChild(n);
  if(desc){
    const d = el("div","desc"); d.innerHTML = desc;
    info.appendChild(d);
  }
  r.appendChild(info);
  if(btnText){
    const b = el("button","btn " + (btnCls||""));
    b.innerHTML = btnText;
    b.disabled = !!disabled;
    b.onclick = onBtn;
    r.appendChild(b);
  }
  return r;
}
function mkHint(text){
  const d = el("div","hint");
  d.innerHTML = text;
  return d;
}

function viewCultivate(root){
  /* --- 境界 --- */
  const c = mkCard("境界修行");
  const cfg = levelConfig[playerData.level];
  const next = levelConfig[playerData.level+1];
  const line = el("div");
  line.style.cssText = "font-size:18px;font-weight:700;color:var(--gold);margin-bottom:6px";
  line.innerHTML = `${cfg.name}${next ? ' <span style="color:var(--muted);font-size:14px">→</span> ' + next.name : ""}`;
  c.appendChild(line);

  if(next && !next.locked){
    c.appendChild(mkBar(playerData.spirit, cfg.cost));
    c.appendChild(mkHint(`突破需灵力 <b class="num">${fmt(cfg.cost)}</b> ／ 现有 <b class="num">${fmt(playerData.spirit)}</b>`));
    if(next.req){
      const req = next.req;
      const parts = [
        `转生 ${playerData.reincCount}/${req.reinc}`,
        `秘境 ${playerData.secretMaxFloor}/${req.secret} 层`,
        `仙材 ${fmt(playerData.material)}/${fmt(req.material)}`,
        `丹渣 ${playerData.dregs}/${req.dregs}`
      ];
      if(req.luck) parts.push(`气运 ${playerData.luckPoints}/${req.luck}`);
      c.appendChild(mkHint("突破前置：" + parts.join(" · ")));
    }
    const btn = el("button","btn gold");
    btn.style.cssText = "width:100%;margin-top:10px;padding:11px";
    btn.textContent = next.trib ? "⚡ 渡劫突破" : "突破境界";
    btn.onclick = levelUp;
    c.appendChild(btn);
  }else{
    c.appendChild(mkHint("已达当前版本顶点，渡劫境开发中。"));
  }
  root.appendChild(c);

  /* --- 气运 --- */
  const cl = mkCard("气运", luckConfig[playerData.luckIndex].name);
  cl.appendChild(mkHint(
    `当前气运倍率 <b style="color:var(--gold)">×${luckConfig[playerData.luckIndex].rate.toFixed(2)}</b>　` +
    `气运值 <b class="num">${playerData.luckPoints}</b>` +
    (playerData.luckLockedUntil > Date.now()
      ? `<br>锁定剩余 ${fmtTime(playerData.luckLockedUntil - Date.now())}`
      : `<br>自动更换剩余 ${fmtTime(playerData.luckEndTime - Date.now())}`)
  ));
  const lRow = el("div");
  lRow.style.cssText = "display:flex;gap:8px;margin-top:8px;flex-wrap:wrap";
  const b1 = el("button","btn gold");
  b1.textContent = `抽取气运（${drawLuckCost()}）`;
  b1.onclick = drawLuck;
  const b2 = el("button","btn");
  b2.textContent = `锁定 ${SETTING.luckLockMin} 分（${lockLuckCost()}）`;
  b2.onclick = lockLuck;
  lRow.appendChild(b1); lRow.appendChild(b2);
  cl.appendChild(lRow);
  root.appendChild(cl);

  /* --- 广告加速 --- */
  const ca = mkCard("灵力加速", `今日 ${playerData.adSpeedToday}/${SETTING.adSpeedDailyLimit}`);
  ca.appendChild(mkHint(`观看广告立即获得 ${SETTING.adSpeedHour} 小时挂机灵力。`));
  const ab = el("button","btn gold");
  ab.style.cssText = "width:100%;margin-top:8px";
  ab.textContent = "观看广告 · 加速";
  ab.disabled = playerData.adSpeedToday >= SETTING.adSpeedDailyLimit;
  ab.onclick = adSpeedUp;
  ca.appendChild(ab);
  root.appendChild(ca);

  /* --- 灵根 --- */
  const rc = rootConfig[playerData.rootIndex];
  const cr = mkCard("灵根", rc.name);
  cr.appendChild(mkHint(`当前倍率 <b style="color:${rc.color}">×${rc.rate.toFixed(2)}</b>　累计洗练 ${playerData.washRootTotal} 次`));
  const rRow = el("div");
  rRow.style.cssText = "display:flex;gap:8px;margin-top:8px;flex-wrap:wrap";
  const r1 = el("button","btn gold");
  r1.textContent = `仙材洗练（${fmt(rootMatCost())}）`;
  r1.onclick = washRootByMaterial;
  const r2 = el("button","btn");
  r2.textContent = "广告洗练（高品质更易出）";
  r2.onclick = washRootByAd;
  rRow.appendChild(r1); rRow.appendChild(r2);
  cr.appendChild(rRow);
  root.appendChild(cr);

  /* --- 丹药 --- */
  const pc = mkCard("炼丹", playerData.pillActive && Date.now()<playerData.pillEndTime
    ? `${pillConfig[playerData.pillIndex].name} 剩余 ${fmtTime(playerData.pillEndTime-Date.now())}` : "未服用");
  const pbox = el("div");
  pillConfig.forEach((p,i)=>{
    pbox.appendChild(mkRow(
      `${p.name} <span class="tag" style="color:var(--gold)">×${p.rate}</span>`,
      `${fmtDur(p.duration/1000)}　消耗灵力 ${fmt(p.cost)}`,
      "炼制", "gold", ()=>makePill(i), playerData.spirit < p.cost
    ));
  });
  pc.appendChild(pbox);
  root.appendChild(pc);

  /* --- 修炼功法 --- */
  const sc = mkCard("修炼功法", `已习 ${playerData.skillUnlocked.length}/${skillConfig.length}`);
  skillConfig.forEach((s,i)=>{
    const owned = playerData.skillUnlocked.includes(i);
    sc.appendChild(mkRow(
      `${s.name} <span class="tag" style="color:var(--green)">×${s.rate}</span>`,
      `习得消耗灵力 ${fmt(s.cost)}`,
      owned ? "已习得" : "习得", owned ? "" : "gold",
      ()=>unlockSkill(i), owned || playerData.spirit < s.cost
    ));
  });
  root.appendChild(sc);

  /* --- 装备强化 --- */
  const ec = mkCard("随身法器");
  equipConfig.forEach((e,i)=>{
    const lv = playerData.equipLv[i]||0;
    const cost = Math.floor(500*Math.pow(2.1, lv));
    const cur = lv>0 ? (e.base + e.step*(lv-1)) : 1;
    ec.appendChild(mkRow(
      `${e.name} <span class="tag" style="color:var(--blue)">Lv.${lv}/${e.maxLv}</span>`,
      `当前倍率 ×${cur.toFixed(3)}　强化消耗灵力 ${fmt(cost)}`,
      lv>=e.maxLv ? "已满级" : "强化", "gold",
      ()=>{
        if(playerData.spirit < cost){ toast("灵力不足"); return; }
        playerData.spirit -= cost;
        playerData.equipLv[i] = lv+1;
        checkAchievement(); saveSave(); renderUI();
        toast(`【${e.name}】强化至 Lv.${lv+1}`);
      },
      lv>=e.maxLv || playerData.spirit < cost
    ));
  });
  root.appendChild(ec);
}

/* ============================================================
 *  十六-C：探险
 * ============================================================ */
function viewExplore(root){
  /* 体力 */
  const c = mkCard("体力", `${playerData.stamina}/${SETTING.maxStamina}`);
  c.appendChild(mkBar(playerData.stamina, SETTING.maxStamina, "stamina-bar"));
  c.appendChild(mkHint(
    playerData.stamina < SETTING.maxStamina
      ? `每 ${SETTING.staminaRegenSec} 秒恢复 1 点，约 ${fmtDur((SETTING.maxStamina-playerData.stamina)*SETTING.staminaRegenSec)} 回满`
      : "体力已满"
  ));
  const ab = el("button","btn");
  ab.style.cssText = "width:100%;margin-top:8px";
  ab.textContent = `观看广告 · 体力 +40（${playerData.adStaminaToday}/${SETTING.adStaminaLimit}）`;
  ab.disabled = playerData.adStaminaToday >= SETTING.adStaminaLimit;
  ab.onclick = adStamina;
  c.appendChild(ab);
  root.appendChild(c);

  /* 当前状态 */
  if(playerData.exploreZone){
    const z = exploreConfig.find(x=>x.id===playerData.exploreZone);
    const cc = mkCard("探险中 · " + (z?z.name:""));
    const left = Math.max(0, playerData.exploreEndTime - Date.now());
    cc.appendChild(mkBar(z?z.duration*1000-left:0, z?z.duration*1000:1));
    cc.appendChild(mkHint(`剩余 ${fmtTime(left)}`));
    const sb = el("button","btn");
    sb.style.cssText = "width:100%;margin-top:8px";
    sb.textContent = "中断探险";
    sb.onclick = stopExplore;
    cc.appendChild(sb);
    root.appendChild(cc);
  }

  /* 地图列表 */
  const cm = mkCard("自由探险");
  exploreConfig.forEach(z=>{
    const unlocked = playerData.level >= z.unlockLevel;
    const wrap = el("div","zone");
    const ic = el("div","zone-icon");
    ic.style.color = z.color;
    ic.textContent = z.icon;
    const body = el("div","zone-body");
    const head = el("div","zone-head");
    const nm = el("div","zone-name");
    nm.textContent = z.name;
    if(!unlocked){
      nm.innerHTML += ` <span style="font-size:11px;color:var(--muted)">（需 ${levelConfig[z.unlockLevel].name}）</span>`;
    }
    const rk = el("div","zone-risk");
    rk.style.color = z.riskColor;
    rk.textContent = "风险 " + z.risk;
    head.appendChild(nm); head.appendChild(rk);
    body.appendChild(head);
    const ds = el("div","zone-desc");
    ds.textContent = z.desc;
    body.appendChild(ds);
    const meta = el("div","zone-desc");
    meta.innerHTML = `体力 ${z.staminaCost}　耗时 ${z.duration}s　已探 ${playerData.zoneVisited[z.id]||0} 次`;
    body.appendChild(meta);
    const acts = el("div","zone-actions");
    const b1 = el("button","btn gold");
    b1.textContent = "前往探险";
    b1.disabled = !unlocked || !!playerData.exploreZone || playerData.stamina < z.staminaCost;
    b1.onclick = ()=>startExplore(z.id);
    const autoOn = playerData.autoExplore && playerData.autoZone === z.id;
    const b2 = el("button","btn" + (autoOn?" gold":""));
    b2.textContent = autoOn ? "停止自动" : "自动循环";
    b2.disabled = !unlocked;
    b2.onclick = ()=>toggleAutoExplore(z.id);
    acts.appendChild(b1); acts.appendChild(b2);
    body.appendChild(acts);
    wrap.appendChild(ic); wrap.appendChild(body);
    cm.appendChild(wrap);
  });
  root.appendChild(cm);

  /* 脱落本命法宝 */
  if(playerData.droppedArtifacts.length){
    const cd = mkCard("遗落的本命法宝");
    playerData.droppedArtifacts.forEach((d,i)=>{
      const zone = exploreConfig.find(z=>z.id===d.zone);
      cd.appendChild(mkRow(
        `<span style="color:${d.color}">${d.icon} ${d.name}</span>`,
        `前世温养至 ${d.lv} 阶　遗落于 ${zone?zone.name:"未知"}　战力加成 ×${(1+0.015*(d.lv-1)).toFixed(3)}`,
        "拾回", "gold", ()=>pickupDroppedArtifact(i)
      ));
    });
    root.appendChild(cd);
  }

  /* 见闻日志 */
  const clog = mkCard("探险见闻");
  const lb = el("div","log");
  if(!playerData.exploreLog.length) lb.innerHTML = '<div style="color:var(--muted)">暂无记录</div>';
  playerData.exploreLog.forEach(t=>{
    const d = el("div"); d.textContent = t; lb.appendChild(d);
  });
  clog.appendChild(lb);
  root.appendChild(clog);
}

/* ============================================================
 *  十六-D：奇遇（NPC / 伙伴 / 师徒）

function viewEncounter(root){
  /* NPC */
  const cn = mkCard("山野道友");
  npcConfig.forEach(n=>{
    const aff = npcAff(n.id);
    const rank = npcRankOf(n.id);
    const wrap = el("div","npc");
    const av = el("div","npc-avatar");
    av.style.color = n.color;
    av.textContent = n.icon;
    const body = el("div","npc-body");
    const head = el("div","npc-head");
    const nm = el("div","npc-name");
    nm.innerHTML = `${n.name} <span class="npc-title">${n.title}</span>`;
    const af = el("div","npc-aff");
    af.textContent = `${rank.name} · ${aff}`;
    head.appendChild(nm); head.appendChild(af);
    body.appendChild(head);

    const lineIdx = playerData.npcLine[n.id];
    const line = el("div","npc-line");
    line.textContent = lineIdx!=null ? n.lines[lineIdx] : n.intro;
    body.appendChild(line);

    const bar = el("div","aff-bar");
    const bi = el("i");
    bi.style.width = Math.min(100, aff/9*100) + "%";
    bar.appendChild(bi);
    body.appendChild(bar);

    const acts = el("div","npc-actions");
    const talk = el("button","btn");
    talk.textContent = "闲谈";
    talk.onclick = ()=>npcTalk(n.id);
    const gift = el("button","btn gold");
    gift.textContent = playerData.npcDailyGifted[n.id] ? "今日已领" : "领赠礼";
    gift.disabled = !!playerData.npcDailyGifted[n.id];
    gift.onclick = ()=>giftNpc(n.id);
    acts.appendChild(talk); acts.appendChild(gift);
    body.appendChild(acts);

    wrap.appendChild(av); wrap.appendChild(body);
    cn.appendChild(wrap);
  });
  root.appendChild(cn);

  /* 伙伴 */
  const cp = mkCard("同行伙伴", `${playerData.partners.length} 位`);
  if(!playerData.partners.length){
    cp.appendChild(mkHint("尚无结识的伙伴，可在奇遇事件「同道相逢」中结识。"));
  }else{
    playerData.partners.forEach(p=>{
      const rel = partnerRel(p);
      const wrap = el("div","npc");
      const av = el("div","npc-avatar"); av.textContent = p.icon;
      const body = el("div","npc-body");
      const head = el("div","npc-head");
      const nm = el("div","npc-name");
      nm.innerHTML = `${p.name} <span class="npc-title">${p.sect}</span>`;
      const af = el("div","npc-aff");
      af.style.color = partnerRelColor(rel);
      af.textContent = `${rel} · ${p.favor}`;
      head.appendChild(nm); head.appendChild(af);
      body.appendChild(head);
      const line = el("div","npc-line"); line.textContent = p.note;
      body.appendChild(line);
      const bar = el("div","aff-bar");
      const bi = el("i");
      bi.style.width = Math.max(0, Math.min(100, (p.favor+100)/2)) + "%";
      bar.appendChild(bi);
      body.appendChild(bar);

      const acts = el("div","npc-actions");
      const mk = (txt, cls, fn)=>{
        const b = el("button","btn " + (cls||""));
        b.textContent = txt;
        b.onclick = fn;
        acts.appendChild(b);
      };
      mk("赠礼 50 仙材", "", ()=>giftPartner(p.uid));
      mk("论道", "", ()=>discussPartner(p.uid));
      mk("交易", "", ()=>tradePartner(p.uid));
      if(rel !== "挚友" && rel !== "道侣") mk("结为挚友", "", ()=>makeFriend(p.uid));
      if(rel !== "仇人") mk("反目", "", ()=>makeEnemy(p.uid));
      if(rel === "挚友") mk("结为道侣", "gold", ()=>makeDaoLu(p.uid));
      body.appendChild(acts);
      wrap.appendChild(av); wrap.appendChild(body);
      cp.appendChild(wrap);
    });
  }
  root.appendChild(cp);

  /* 师徒 */
  const cm = mkCard("师门传承");
  if(playerData.mentor){
    const m = mentorConfig.find(x=>x.id===playerData.mentor.id);
    if(m){
      cm.appendChild(mkRow(
        `${m.icon} ${m.name} <span class="tag" style="color:${m.color}">${m.title}</span>`,
        `${m.desc}<br>师缘 ${playerData.mentor.bond||0}/100　今日请教 ${playerData.mentorAskToday}/1`,
        m.askLabel, "gold", askMentor, playerData.mentorAskToday >= 1
      ));
    }
  }else{
    cm.appendChild(mkHint("尚未拜师，可在奇遇事件「师门缘法」中拜入师门。"));
  }
  if(playerData.apprentice){
    const a = playerData.apprentice;
    cm.appendChild(mkRow(
      `🌱 ${a.name} <span class="tag" style="color:var(--green)">弟子</span>`,
      `${a.note}<br>忠诚 ${a.loyalty}/100　每 5 分钟回馈一次灵力`,
      "", null, null, true
    ));
  }else{
    cm.appendChild(mkHint("尚无弟子。"));
  }
  root.appendChild(cm);
}

 *  十六-E：养成（装备 / 功法 / 灵宠 / 本命 / 矿石）

function viewGrow(root){
  const st = totalStats();
